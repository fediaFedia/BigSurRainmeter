[Rainmeter]
Author=Xyrfo and fediaFedia
Update=86400000
MiddleMouseUpAction=!DeactivateConfig
Blur=#enableaero#
BlurRegion=1,0,0,#width#,#Height#


Group=BigSur

RightMouseUpAction=[!SkinCustomMenu]
ContextTitle=#AddItems#
ContextAction=[!WriteKeyValue Variables LastCat Widgets #skinspath#\BigSur\Gallery\Gallery.ini][!ActivateConfig "BigSur\Gallery" "Gallery.ini"]
ContextTitle2=#Settings#
ContextAction2=["#@#Config.exe" #Type# "#CURRENTCONFIG#" "#CURRENTFILE#" "#SETTINGSPATH#" "#SKINSPATH#" "#PROGRAMPATH#" "#scaledpi#"]
ContextTitle3=----
ContextAction3=[]

ContextTitle4=Right Align
ContextAction4=[!SetVariable Columns 0][!CommandMeasure MeasureGrid "Arrange()"][!Update]
ContextTitle5=----
ContextTitle6=Refresh All
ContextAction6=[!Refresh *]
ContextTitle7=#MoreActions#
ContextAction7=[!SkinMenu]



OnRefreshAction=[!ZPos "-2"][!Draggable "0"][!Move "(#workareawidth#-((170 + #SidebarPadding#*2)*#SidebarSize#*#scaledpi#))" "0"][!WriteKeyValue Variables AlignWidth [CalcWidth]]



[Metadata]
Version=6.0
Information=Customizable Background
License=Creative Commons Attribution-Noncommercial-Share Alike 3.0 License

[Variables]
@include=#@#Global.inc
@include1=#@#Languages\#MainLanguage#.inc
@include3=#currentpath#\UserVariables.inc
ColorSkin=242,242,242
TextColor2=0,0,0

HeightE=40
HideThis=1

; 0 = automatic width, or set 2, 3, or 4 Regular-sized columns.
Columns=0
; Uses the Rainmeter #scaledpi# variable when available; falls back to 1.
Scale=#scaledpi#
Labels=#HideLabels#
ScreenWidth=#SCREENAREAWIDTH#
ScreenHeight=#SCREENAREAHEIGHT#
AlignWidth=1880

[CalcWidth]
Measure=Calc
Formula=((#workareawidth#-(40*#scaledpi#))-(#SidebarPadding#*2))





[MeterBackground1]
Meter=Image
solidcolor=#ColorSkin#,#Opacity#
Hidden=0
W=((200+#SidebarPadding#*2)*#SidebarSize#*#scaledpi#) 
H=#CustomHeight#
x=14
DynamicVariables=1





[MeterShadow]
Meter=Image
imagename=shadow.png
W=14
H=#CustomHeight#
DynamicVariables=1
Hidden=#EnableShadow#



[MeasureGrid]
Measure=Script
ScriptFile=GridAlign.lua
StartX=#StartX#
StartY=#StartY#
Columns=#Columns#
Scale=#Scale#
ScreenWidth=#ScreenWidth#
ScreenHeight=#ScreenHeight#
