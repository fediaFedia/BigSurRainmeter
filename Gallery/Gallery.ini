[Rainmeter]
Author=Xyrfo and fediaFedia
Update=86400000
Blur=1
MouseActionCursor=0
BlurRegion=2,0,0,670*#scaledpi#,280*#scaledpi#,35
Group=Widget | BigSur
MiddleMouseUpAction=!DeactivateConfig
OnRefreshAction=[!SnapEdges 0 BigSur\Gallery]

MouseScrollUpAction=!ActivateConfig "wp7\gallery" "thankyou.ini"
MouseScrollDownAction=!ActivateConfig "wp7\gallery" "installed.ini"




[Metadata]
Version=6.0
Information=Panel Gallery
License=Creative Commons Attribution-NonCommercial-NoDerivs 3.0




 [Variables] 
LastCat=Widgets
@include=#@#Global.inc
@include1=#@#Languages\#MainLanguage#.inc
title=1

rss-en=https://www.theguardian.com/world/rss
rss-ru=http://lenta.ru/rss/news
rss-de=https://www.tagesschau.de/index~rss2.xml
rss-es=https://e00-elmundo.uecdn.es/elmundo/rss/internacional.xml
rss-fr=https://www.lemonde.fr/rss/une.xml
rss-pt=https://www.noticiasaominuto.com/rss/ultima-hora
rss-kr=https://www.chosun.com/arc/outboundfeeds/rss/?outputType=xml
rss-jp=https://www.digital.go.jp/rss/news.xml
rss-hi=https://www.bhaskar.com/rss-v1--category-1061.xml

Height=160
Stay=0
TintedPallet=0
HideHint=1

[LiquidGlass]
Measure=Plugin
Plugin=#BlurMode#
Blur=14
Radius=28
Padding=30
Saturation=1.0
RefractionHeight=1.0
RefractionCorrect=1.0
Dispersion=1.0
Darkening=1
HighlightAlpha=0.0
ShadowAlpha=0.0
ShadowOffsetY=0
Tint=90,160,255,20
FPS=1
BlurRegion=2, 0, 0, (720)*#scaledpi#, (480)*#scaledpi#,(#radius#)*#ScaleDpi#
MotionFPS=0
UpdateDivider=-1
dynamicvariables=1

[GlassBlur]
Measure=Plugin
Plugin=GlassBlur
Type=Blur
Radius=30
; BlurRegion=Type, X, Y, Width, Height[, Radius] - Type 0 = whole skin, 1 = rectangle, 2 = rounded (overrides Radius)
BlurRegion=2, 0, 0, (720)*#scaledpi#, (480)*#scaledpi#,(#radius#)*#ScaleDpi#
Disabled=#BlurDisabled#



[Shape]
Meter=Shape
Shape=Rectangle 0,0,(720)*#scaledpi#,(480)*#scaledpi#,(#radius#*#ScaleDpi#)  | StrokeWidth #StrokeWidth# | Stroke LinearGradient StrokeGradient | Fill LinearGradient FillGradient
FillGradient=#colorskinGradAngle# | #colorskin#,#opacity2# ; 0.0 | #colorskinGrad#,#opacity2# ; 1
StrokeGradient=#StrokeAngle# | #StrokeColor#,#StrokeOpacity# ; 0.0 | #StrokeColorGrad#,#StrokeOpacity# ; 1




[Background]
Meter=Image
ImageName=#@#Graphics\#Structure#\double#darkmode#3.png
h=(480)*#scaledpi#
w=(720)*#scaledpi#

ScaleMargins=50,50,50,50
@include3=#LastCat#.inc





[Side]
FontColor=#textcolor2#,140
FontFace=#ThemeFont#
InlineSetting=#InlineShadow#
FontSize=(15)*#scaledpi#
StringAlign=LEFT
MouseActionCursor=1
AntiAlias=1
solidcolor=0,0,0,1
Y=(8)*#scaledpi#R
x=r
LeftMouseUpAction=[!WriteKeyValue Variables LastCat #CURRENTSECTION#][!Refresh #currentconfig#]
MouseOverAction=[!SetOption #CURRENTSECTION# fontcolor #textcolor2#,180][!Update]
MouseLeaveAction=[!SetOption #CURRENTSECTION# fontcolor #textcolor2#,140][!Update]



[Widgets]
Meter=String
Y=(65)*#scaledpi#
x=(25)*#scaledpi#
MeterStyle=Side
Text=#Widgets#
Y=(65)*#scaledpi#

[Shortcuts]
Meter=String
MeterStyle=Side
Text=#Shortcuts#
FontColor=#textcolor2#,130
MouseOverAction=[!SetOption #CURRENTSECTION# fontcolor #textcolor2#,180][!Update]
MouseLeaveAction=[!SetOption #CURRENTSECTION# fontcolor #textcolor2#,130][!Update]
Y=(92)*#scaledpi#

[Web]
Meter=String
MeterStyle=Side
Text=#Web#
FontColor=#textcolor2#,120
MouseOverAction=[!SetOption #CURRENTSECTION# fontcolor #textcolor2#,180][!Update]
MouseLeaveAction=[!SetOption #CURRENTSECTION# fontcolor #textcolor2#,120][!Update]
Y=(119)*#scaledpi#

[Extras]
Meter=String
MeterStyle=Side
Text=#Extras#
FontColor=#textcolor2#,110
MouseOverAction=[!SetOption #CURRENTSECTION# fontcolor #textcolor2#,180][!Update]
MouseLeaveAction=[!SetOption #CURRENTSECTION# fontcolor #textcolor2#,110][!Update]
Y=(146)*#scaledpi#

[Donator]
Meter=String
MeterStyle=Side
Text=#Donator#
FontColor=#textcolor2#,100
MouseOverAction=[!SetOption #CURRENTSECTION# fontcolor #textcolor2#,180][!Update]
MouseLeaveAction=[!SetOption #CURRENTSECTION# fontcolor #textcolor2#,100][!Update]
Y=(173)*#scaledpi#

[Settings]
Meter=String
MeterStyle=Side
Text=#Settings#
FontColor=#textcolor2#,90
MouseOverAction=[!SetOption #CURRENTSECTION# fontcolor #textcolor2#,180][!Update]
MouseLeaveAction=[!SetOption #CURRENTSECTION# fontcolor #textcolor2#,90][!Update]
Y=(200)*#scaledpi#

[Style]
Meter=String
MeterStyle=Side
Text=#Style#
FontColor=#textcolor2#,90
MouseOverAction=[!SetOption #CURRENTSECTION# fontcolor #textcolor2#,180][!Update]
MouseLeaveAction=[!SetOption #CURRENTSECTION# fontcolor #textcolor2#,90][!Update]
Y=(227)*#scaledpi#


[Help]
Meter=String
MeterStyle=Side
Text=#Help#
FontColor=#textcolor2#,80
MouseOverAction=[!SetOption #CURRENTSECTION# fontcolor #textcolor2#,180][!Update]
MouseLeaveAction=[!SetOption #CURRENTSECTION# fontcolor #textcolor2#,80][!Update]
Y=(414)*#scaledpi#
LeftMouseUpAction=!execute ["#currentpath#help.html"]

[About]
Meter=String
MeterStyle=Side
Text=#About#
FontColor=#textcolor2#,80
MouseOverAction=[!SetOption #CURRENTSECTION# fontcolor #textcolor2#,180][!Update]
MouseLeaveAction=[!SetOption #CURRENTSECTION# fontcolor #textcolor2#,80][!Update]
Y=(441)*#scaledpi#







[MeterShapes]
Meter=Shape
Shape=Rectangle (190)*#scaledpi#,0,(1)*#scaledpi#,(480)*#scaledpi#,0 | Fill Color #textcolor2#,50 | StrokeColor 0,255,0,0






[close]

Meter=Image
LeftMouseUpAction=!DeactivateConfig
imagename=#@#\close.png
x=(25)*#scaledpi#
y=(25)*#scaledpi#
imagetint=#textcolor2#,#textopacity#
w=(25)*#scaledpi#
h=(25)*#scaledpi#
LeftMouseUpAction=!DeactivateConfig
imagealpha=200
MouseOverAction=[!SetOption #CURRENTSECTION# imagealpha 255][!Update]
MouseLeaveAction=[!SetOption #CURRENTSECTION# imagealpha 200][!Update]


[hint]
meter=image
imagename=try#HideHint#.png

x=(300)*#scaledpi#
y=(45)*#scaledpi#
imagetint=#textcolor2#,#textopacity#
w=(230)*#scaledpi#
h=(230)*#scaledpi#
LeftMouseUpAction=!execute [!WriteKeyValue Variables HideHint 1]
Hidden=#HideHint#

[try]
Meter=String
MeterStyle=Side
Text=Try also other sizes
FontColor=#textcolor2#,255
x=(305)*#scaledpi#
y=(256)*#scaledpi#
Hidden=#HideHint#
StringAlign=Right
LeftMouseUpAction=!execute [!WriteKeyValue Variables HideHint 1]
