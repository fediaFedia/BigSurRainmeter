[measurefunnythings]
Measure=Calc
Formula=-1*#ClockNewsEnabled#+1


[Blur0]
Meter=String
Y=(205)*#scaledpi#
x=(147)*#scaledpi#
MeterStyle=Default
Text=#ClockAndNews#


[Blur1]
Meter=Image
solidcolor=0,0,0,1
w=((50*#ScaleDpi#))
h=((25*#ScaleDpi#))
x=((431*#ScaleDpi#))
y=(-5)*#scaledpi#r


[Blur2]
Meter=Image
ImageName=#@#\Graphics\Gallery\off#OnOff#[measurefunnythings]#ttgallerystyle#.png
x=r
w=((85*#ScaleDpi#))
y=((-25*#ScaleDpi#))R
LeftMouseUpAction=[!ToggleConfig "BigSur\Extras\ClockNews" "Item.ini"][!WriteKeyValue Variables ClockNewsEnabled 0][!Refresh "#currentconfig#"]
MouseActionCursor=1 
DynamicVariables=1


[Blur3]
Meter=Image
ImageName=#@#\Graphics\Gallery\on#OnOff#[measurefunnythings]#ttgallerystyle#.png
x=r
w=((85*#ScaleDpi#))
y=R
LeftMouseUpAction=[!ToggleConfig "BigSur\Extras\ClockNews" "Item.ini"][!WriteKeyValue Variables ClockNewsEnabled 1][!Refresh "#currentconfig#"]
MouseActionCursor=1
DynamicVariables=1
ToolTipText=Recommended to Disable on Win7



