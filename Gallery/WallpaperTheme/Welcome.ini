[Rainmeter]
Author=Xyrfo and fediaFedia
Update=86400000
Blur=#ttblur#
MouseActionCursor=0
Group=BigSur | Widget
MiddleMouseUpAction=!DeactivateConfig
OnRefreshAction=[!SnapEdges 0 BigSur\Gallery]





[Metadata]
Version=6.0
Information=Panel Gallery
License=Creative Commons Attribution-NonCommercial-NoDerivs 3.0




 [Variables] 
LastCat=Widgets
@include="#@#Global.inc"
@include1=#@#Languages\#MainLanguage#.inc
Stay=0
TintedPallet=0
ClockNewsEnabled=0

[GlassBlur]
Measure=Plugin
Plugin=GlassBlur
Intensity=3
ScreenAreaWidth=#ScreenAreaWidth#
ScreenAreaHeight=#ScreenAreaHeight#
XPos=#CURRENTCONFIGX#
YPos=#CURRENTCONFIGY#
XWidth=(660)*#scaledpi#
XHeight=(360)*#scaledpi#
DontResize=1
Disabled=0

[Blur]
Meter=Image
ImageName=[GlassBlur]
DynamicVariables=1
solidcolor=0,0,0,1
w=(660)*#scaledpi#
h=(360)*#scaledpi#
Container=MeterContainer1D

[MeterContainer1D]
Meter=Shape
Shape=Rectangle 0,0,(660)*#scaledpi#,(360)*#scaledpi#,(#radius#*#scaledpi#) | Fill Color 255,47,47,255 | StrokeWidth 0
X=0
Y=0

[Shape]
Meter=Shape
Shape=Rectangle 0,0,(660)*#scaledpi#,(360)*#scaledpi#,0  | StrokeWidth #StrokeWidth# | Stroke LinearGradient StrokeGradient | Fill LinearGradient FillGradient
FillGradient=#colorskinGradAngle# | #colorskin#,#opacity2# ; 0.0 | #colorskinGrad#,#opacity2# ; 1
StrokeGradient=#StrokeAngle# | #StrokeColor#,#StrokeOpacity# ; 0.0 | #StrokeColorGrad#,#StrokeOpacity# ; 1
MouseActionCursor=1 


[Background]
Meter=Image
ImageName=#@#Graphics\#Structure#\double#darkmode#B.png
h=(360)*#scaledpi#
w=(660)*#scaledpi#

ScaleMargins=50,50,50,50


[close]
MouseActionCursor=1
Meter=Image
LeftMouseUpAction=!DeactivateConfig
ToolTipText=#Close#
imagename=#@#\close.png
x=(25)*#scaledpi#
y=(25)*#scaledpi#
imagetint=#textcolor2#,#textopacity#
w=(25)*#scaledpi#
h=(25)*#scaledpi#
LeftMouseUpAction=!DeactivateConfig
imagealpha=150


[St]
Meter=String
Y=(40)*#scaledpi#
x=(328)*#scaledpi#
MeterStyle=Side
text=#PickStyle#
InlineSetting=#InlineShadow#
FontSize=(16)*#scaledpi#
stringalign=centercenter
fontcolor=#textcolor2#,#textopacity#
Antialias=1

ToolTipText=#CustomizeMore#

DynamicVariables=1
MouseActionCursor=1


[Styk]
ImageName=#@#Graphics\Styles\#currentsection#.png
w=(83)*#scaledpi#
x=(10)*#scaledpi#R
y=r
MouseActionCursor=1 
ToolTipText=#currentsection#





[Light]
Meter=Image
MeterStyle=Styk
x=(140*#scaledpi#)
y=(80)*#scaledpi#
LeftMouseUpAction=[!WriteKeyValue Variables HideWeatherPreload 1 #SKINSPATH#BigSur\Widgets\Weather\UserVariables.inc][!WriteKeyValue Variables TintedPallet "0"][!WriteKeyValue Variables InlineShadow "" "#@#Global.inc"][!WriteKeyValue Variables WidgetShadow "1" "#@#Global.inc"][!WriteKeyValue Variables SelectedStyle #currentsection# "#@#Global.inc"][!WriteKeyValue Variables colorskin "240,240,240" "#@#Global.inc"][!WriteKeyValue Variables colorskinGrad "240,240,240" "#@#Global.inc"][!WriteKeyValue Variables textcolor2 "0,0,0" "#@#Global.inc"][!WriteKeyValue Variables ttgallerystyle light "#@#Global.inc"][!WriteKeyValue Variables DarkMode 0 "#@#Global.inc"][!WriteKeyValue Variables IconGreyscale 0 "#@#Global.inc"][!WriteKeyValue Variables IconTint "" "#@#Global.inc"][!WriteKeyValue Variables IconTintSpecial "" "#@#Global.inc"][!WriteKeyValue Variables StrokeWidth 0 "#@#Global.inc"][!WriteKeyValue Variables BatteryColor "9, 222, 72" "#skinspath#BigSur\Widgets\Battery\UserVariables.inc"][!WriteKeyValue Variables Color3  "0,177,205"  "#skinspath#BigSur\Widgets\System\UserVariables.inc"][!WriteKeyValue Variables Color2  "120,206,13"  "#skinspath#BigSur\Widgets\System\UserVariables.inc"][!WriteKeyValue Variables Color1  "240,34,106"  "#skinspath#BigSur\Widgets\System\UserVariables.inc"][!WriteKeyValue Variables redcolor "255,90,90" "#@#Global.inc"][!WriteKeyValue Variables ClockStyle Default "#skinspath#BigSur\Widgets\Clock\UserVariables.inc"][!WriteKeyValue Variables radius 23 "#@#Global.inc"][!WriteKeyValue Variables roundness 15 "#@#Global.inc"][!WriteKeyValue Variables opacity2 255 "#@#Global.inc"][!WriteKeyValue Variables Structure Structure "#@#Global.inc"][!WriteKeyValue Variables Padding 0 "#@#Global.inc"][!WriteKeyValue Variables BlurDisabled 1 "#@#Global.inc"][!RefreshGroup Widget]


[LightLabel]
Meter=String
Y=(8)*#scaledpi#R
x=(41)*#scaledpi#r
MeterStyle=Default
Text=#Light#
StringAlign=center

[Dark]
Meter=Image
MeterStyle=Styk
LeftMouseUpAction=[!WriteKeyValue Variables HideWeatherPreload 1 #SKINSPATH#BigSur\Widgets\Weather\UserVariables.inc][!WriteKeyValue Variables TintedPallet "0"][!WriteKeyValue Variables InlineShadow "" "#@#Global.inc"][!WriteKeyValue Variables WidgetShadow "1" "#@#Global.inc"][!WriteKeyValue Variables SelectedStyle #currentsection# "#@#Global.inc"][!WriteKeyValue Variables colorskin "30,30,30" "#@#Global.inc"][!WriteKeyValue Variables colorskinGrad "30,30,30" "#@#Global.inc"][!WriteKeyValue Variables textcolor2 "255,255,255" "#@#Global.inc"][!WriteKeyValue Variables ttgallerystyle dark "#@#Global.inc"][!WriteKeyValue Variables DarkMode 1 "#@#Global.inc"][!WriteKeyValue Variables IconGreyscale 0 "#@#Global.inc"][!WriteKeyValue Variables IconTint "" "#@#Global.inc"][!WriteKeyValue Variables IconTintSpecial "" "#@#Global.inc"][!WriteKeyValue Variables StrokeWidth 0 "#@#Global.inc"][!WriteKeyValue Variables BatteryColor "9, 222, 72" "#skinspath#BigSur\Widgets\Battery\UserVariables.inc"][!WriteKeyValue Variables Color3  "0,177,205"  "#skinspath#BigSur\Widgets\System\UserVariables.inc"][!WriteKeyValue Variables Color2  "120,206,13"  "#skinspath#BigSur\Widgets\System\UserVariables.inc"][!WriteKeyValue Variables Color1  "240,34,106"  "#skinspath#BigSur\Widgets\System\UserVariables.inc"][!WriteKeyValue Variables redcolor "255,90,90" "#@#Global.inc"][!WriteKeyValue Variables ClockStyle Default "#skinspath#BigSur\Widgets\Clock\UserVariables.inc"][!WriteKeyValue Variables radius 23 "#@#Global.inc"][!WriteKeyValue Variables roundness 15 "#@#Global.inc"][!WriteKeyValue Variables opacity2 255 "#@#Global.inc"][!WriteKeyValue Variables Structure Structure "#@#Global.inc"][!WriteKeyValue Variables Padding 0 "#@#Global.inc"][!WriteKeyValue Variables BlurDisabled 1 "#@#Global.inc"][!RefreshGroup Widget]
Y=(-93)*#scaledpi#r
x=(58)*#scaledpi#r

[DarkLabel]
Meter=String
Y=(8)*#scaledpi#R
x=(41)*#scaledpi#r
MeterStyle=Default
Text=#Dark#
StringAlign=center

[Transparent]
Meter=Image
MeterStyle=Styk
LeftMouseUpAction=[!WriteKeyValue Variables opacity "255" "#@#Global.inc"][!WriteKeyValue Variables TintedPallet "0"][!WriteKeyValue Variables InlineShadow "" "#@#Global.inc"][!WriteKeyValue Variables WidgetShadow "1" "#@#Global.inc"][!WriteKeyValue Variables colorskin "255,255,255"  "#skinspath#BigSur\Widgets\Weather\UserVariables.inc"][!WriteKeyValue Variables DarkMode 1 "#@#Global.inc"][!WriteKeyValue Variables colorskin "230,230,230" "#@#Global.inc"][!WriteKeyValue Variables colorskinGrad "140,140,140" "#@#Global.inc"][!WriteKeyValue Variables textcolor2 "255,255,255" "#@#Global.inc"][!WriteKeyValue Variables ttgallerystyle dark "#@#Global.inc"][!WriteKeyValue Variables IconGreyscale 1 "#@#Global.inc"][!WriteKeyValue Variables IconTint #*textcolor2*# "#@#Global.inc"][!WriteKeyValue Variables IconTintSpecial #*textcolor2*# "#@#Global.inc"][!WriteKeyValue Variables StrokeWidth 1 "#@#Global.inc"][!WriteKeyValue Variables StrokeColor 255,255,255,30 "#@#Global.inc"][!WriteKeyValue Variables StrokeColorGrad 255,255,255,200 "#@#Global.inc"][!WriteKeyValue Variables StrokeColorAngle 90 "#@#Global.inc"][!WriteKeyValue Variables BatteryColor #*textcolor2*# "#skinspath#BigSur\Widgets\Battery\UserVariables.inc"][!WriteKeyValue Variables Color3 #*textcolor2*# "#skinspath#BigSur\Widgets\System\UserVariables.inc"][!WriteKeyValue Variables Color2 #*textcolor2*# "#skinspath#BigSur\Widgets\System\UserVariables.inc"][!WriteKeyValue Variables Color1 #*textcolor2*# "#skinspath#BigSur\Widgets\System\UserVariables.inc"][!WriteKeyValue Variables redcolor "255,255,255,150" "#@#Global.inc"][!WriteKeyValue Variables ClockStyle Blur "#skinspath#BigSur\Widgets\Clock\UserVariables.inc"][!WriteKeyValue Variables opacity2 30 "#@#Global.inc"][!WriteKeyValue Variables BlurDisabled 0 "#@#Global.inc"][!RefreshGroup Widget]
Y=(-93)*#scaledpi#r
x=(58)*#scaledpi#r

[TransparentLabel]
Meter=String
Y=(8)*#scaledpi#R
x=(41)*#scaledpi#r
MeterStyle=Default
Text=#Transparent#
StringAlign=center


[DarkGlass]
Meter=Image
MeterStyle=Styk
LeftMouseUpAction=[!WriteKeyValue Variables HideWeatherPreload 1 #SKINSPATH#BigSur\Widgets\Weather\UserVariables.inc][!WriteKeyValue Variables TintedPallet "0"][!WriteKeyValue Variables InlineShadow "Shadow | 2 | 2 | 3.5 | 0,0,0,150" "#@#Global.inc"][!WriteKeyValue Variables WidgetShadow "0" "#@#Global.inc"][!WriteKeyValue Variables DarkMode 1 "#@#Global.inc"][!WriteKeyValue Variables colorskin "0,0,0" "#@#Global.inc"][!WriteKeyValue Variables colorskinGrad "30,30,30" "#@#Global.inc"][!WriteKeyValue Variables textcolor2 "255,255,255" "#@#Global.inc"][!WriteKeyValue Variables ttgallerystyle dark "#@#Global.inc"][!WriteKeyValue Variables IconGreyscale 1 "#@#Global.inc"][!WriteKeyValue Variables IconTint #*textcolor2*# "#@#Global.inc"][!WriteKeyValue Variables IconTintSpecial #*textcolor2*# "#@#Global.inc"][!WriteKeyValue Variables StrokeWidth 1 "#@#Global.inc"][!WriteKeyValue Variables StrokeColor 30,30,30,100 "#@#Global.inc"][!WriteKeyValue Variables StrokeColorGrad 255,255,255,200 "#@#Global.inc"][!WriteKeyValue Variables StrokeColorAngle 90 "#@#Global.inc"][!WriteKeyValue Variables BatteryColor #*textcolor2*# "#skinspath#BigSur\Widgets\Battery\UserVariables.inc"][!WriteKeyValue Variables Color3 #*textcolor2*# "#skinspath#BigSur\Widgets\System\UserVariables.inc"][!WriteKeyValue Variables Color2 #*textcolor2*# "#skinspath#BigSur\Widgets\System\UserVariables.inc"][!WriteKeyValue Variables Color1 #*textcolor2*# "#skinspath#BigSur\Widgets\System\UserVariables.inc"][!WriteKeyValue Variables redcolor "255,255,255,150" "#@#Global.inc"][!WriteKeyValue Variables ClockStyle Blur "#skinspath#BigSur\Widgets\Clock\UserVariables.inc"][!WriteKeyValue Variables opacity2 100 "#@#Global.inc"][!WriteKeyValue Variables BlurDisabled 0 "#@#Global.inc"][!RefreshGroup Widget]
