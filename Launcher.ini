[Rainmeter]
Author=Xyrfo and fediaFedia
MouseActionCursor=0
MiddleMouseUpAction=!DeactivateConfig
Update=-1
Group=TextItem | BigSur
MouseOverAction=[!SetOption btn imagealpha 255][!ShowMeter Down][!Update]
MouseLeaveAction=[!SetOption btn imagealpha 150][!HideMeter Down][!Update]


RightMouseUpAction=[!SkinCustomMenu]
ContextTitle=#AddItems#
ContextAction=[!WriteKeyValue Variables LastCat Widgets #skinspath#\BigSur\Gallery\Gallery.ini][!ActivateConfig "BigSur\Gallery" "Gallery.ini"]
ContextTitle2=#Settings#
ContextAction2=[!WriteKeyValue Variables LastCat Settings #skinspath#\BigSur\Gallery\Gallery.ini][!ActivateConfig "BigSur\Gallery" "Gallery.ini"]
ContextTitle3=----
ContextAction3=[]
ContextTitle4=#AutoArrangeWidgets#
ContextAction4=[!SetVariable Columns 0][!CommandMeasure MeasureGrid "Arrange()"][!Update]
ContextTitle5=#ArrangeTo2#
ContextAction5=[!SetVariable Columns 2][!CommandMeasure MeasureGrid "Arrange()"][!Update]
ContextTitle6=#ArrangeTo3#
ContextAction6=[!SetVariable Columns 3][!CommandMeasure MeasureGrid "Arrange()"][!Update]
ContextTitle7=----
ContextAction7=[]
ContextTitle8=Refresh All
ContextAction8=[!Refresh *]
ContextTitle9=#MoreActions#
ContextAction9=[!SkinMenu]


[Metadata]
Version=6.0
Information=Shortcut Item
License=Creative Commons Attribution-NonCommercial-NoDerivs 3.0


 [Variables] 
Height=40
PanelType=single

ColorSkin=30,30,30
ColorSkin2=50,50,50

@include1=#@#Global.inc
@include2=#@#Languages\#MainLanguage#.inc
HideThis=0

; 0 = automatic width, or set 2, 3, or 4 Regular-sized columns.
Columns=0
; Uses the Rainmeter #scaledpi# variable when available; falls back to 1.
Scale=#scaledpi#
Labels=#HideLabels#
ScreenWidth=#SCREENAREAWIDTH#
ScreenHeight=#SCREENAREAHEIGHT#



[sol]
Meter=Image
solidcolor=0,0,0,1
W=(#Height#*#scaledpi#)
H=(#Height#*1.5*#scaledpi#)
x=0
y=0



[btn]
Meter=Image
solidcolor=0,0,0,1
ImageName=#@#\Graphics\Plus.png
W=(#Height#*#scaledpi#)
H=(#Height#*#scaledpi#)
x=0
y=0
imagealpha=150
LeftMouseUpAction=[!WriteKeyValue Variables LastCat Widgets #skinspath#\BigSur\Gallery\Gallery.ini][!ActivateConfig "BigSur\Gallery" "Gallery.ini"][!WriteKeyValue Variables HideThis 0]
ToolTipText=#AddItems#
MouseActionCursor=1
ToolTipHidden=#HideThis#
imagetint=#ExtrasColor#
[Down]
Meter=Image
ImageName=#@#\Graphics\down.png
LeftMouseUpAction=[!SkinCustomMenu]
X=0
y=-5R
w=(40*#scaledpi#)
imagetint=#ExtrasColor#
ImageAlpha=180
MouseOverAction=[!SetOption #CURRENTSECTION# ImageAlpha 255][!Update]
MouseLeaveAction=[!SetOption #CURRENTSECTION# ImageAlpha 180][!Update]
Hidden=1




[MeasureGrid]
Measure=Script
ScriptFile=GridAlign.lua
StartX=#StartX#
StartY=#StartY#
Columns=#Columns#
Scale=#Scale#
ScreenWidth=#ScreenWidth#
ScreenHeight=#ScreenHeight#
