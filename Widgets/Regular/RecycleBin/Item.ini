[Rainmeter]
DragGroup=BigSur
Group=Widget | BigSur
Author=Xyrfo and fediaFedia
OnRefreshAction=[!SetTransparency "#opacity#"]
MouseActionCursor=0
MiddleMouseUpAction=!DeactivateConfig
Update=5000

Blur=#globalblurenable#
BlurRegion=2,(11-#Padding#)*#ScaleDpi#,(10-#Padding#)*#ScaleDpi#,(#height#+#Padding#+#Padding#)*#ScaleDpi#,(#height#+#Padding#+#Padding#)*#ScaleDpi#,(#radius#*#ScaleDpi#)


RightMouseUpAction=[!SkinCustomMenu]
ContextTitle=#Settings#
ContextAction=["#@#Config.exe" #Type# "#CURRENTCONFIG#" "#CURRENTFILE#" "#SETTINGSPATH#" "#SKINSPATH#" "#PROGRAMPATH#" "#scaledpi#"]

ContextTitle2=#Alternative#
ContextAction2=[!ActivateConfig "#CURRENTCONFIG#"]
ContextTitle3=#Close#
ContextAction3=[!DeactivateConfig]
ContextTitle4=----
ContextAction4=[]

ContextTitle5=Empty Trash
ContextAction5=[!CommandMeasure MeasureBin EmptyBin]

ContextTitle6=#AddItems#
ContextAction6=[!ActivateConfig "BigSur\Gallery" "Gallery.ini"]
ContextTitle7=----
ContextAction7=[]
ContextTitle8=#MoreActions#
ContextAction8=[!SkinMenu]

[Metadata]
Version=1.5.0
Information=BigSur 27 for Rainmeter
License=Creative Commons Attribution-Noncommercial-Share Alike 3.0 License

 
 [Variables] 
Type=Regular
@include=#@#Global.inc
@include1=#@#Languages\#MainLanguage#.inc
@include2=#@#\Structure\#Type#\Type.inc
Name=Recycle Bin
Height=160

[MeasureBinItems]
Measure=Plugin
Plugin=Plugins\RecycleManager.dll
Drives=ALL
RecycleType=COUNT

[MeasureBinSize]
Measure=Plugin
Plugin=Plugins\RecycleManager.dll
Drives=ALL
RecycleType=SIZE


[MeasureBinSize2]
Measure=Calc
DynamicVariables=1
Formula=ROUND([MeasureBinSize] / 1024 / 1024 / 1024, 2)
[MeasureBin]
Measure=Plugin
Plugin=Plugins\RecycleManager.dll
Drives=ALL
RecycleType=COUNT
IfEqualValue=0
IfEqualAction=!Execute [!HideMeter BinFull][!ShowMeter BinEmpty]
IfAboveValue=0
IfAboveAction=!Execute [!HideMeter BinEmpty][!ShowMeter BinFull]

[Text]
Meter=String
Autoscale=1
MeasureName=MeasureBinSize
Text=Trash %1B

[BinEmpty]
Meter=Image
ImageName=#currentpath#\RecycleEmpty.png
DynamicVariables=1
LeftMouseUpAction=!execute ["shell:RecycleBinFolder"]
W=((#Height#*0.8))*#scaledpi#
H=((#Height#*0.8))*#scaledpi#
X=((#Height#/5.4))*#scaledpi#
Y=((#Height#/7+5))*#scaledpi#
AntiAlias=1
ImageTint=#IconTintSpecial#
Greyscale=#IconGreyscale#
ToolTipText=[MeasureBinItems] Items

[BinFull]
Meter=Image
ImageName=#currentpath#\RecycleFull.png
DynamicVariables=1
LeftMouseUpAction=!execute ["shell:RecycleBinFolder"]
W=((#Height#*0.8))*#scaledpi#
H=((#Height#*0.8))*#scaledpi#
X=((#Height#/5.4))*#scaledpi#
Y=((#Height#/7+5))*#scaledpi#
AntiAlias=1
ImageTint=#IconTintSpecial#
Greyscale=#IconGreyscale#
ToolTipText=[MeasureBinItems] Items#CRLF#[MeasureBinSize2] GB
MouseActionCursor=1


