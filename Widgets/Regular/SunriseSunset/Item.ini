[Rainmeter]
DragGroup=BigSur
Group=Widget | BigSur
Author=Xyrfo and fediaFedia
OnRefreshAction=[!SetTransparency "#opacity#"]
MouseActionCursor=0
MiddleMouseUpAction=!DeactivateConfig
Update=-1

Blur=#globalblurenable#
BlurRegion=2,(11-#Padding#)*#ScaleDpi#,(10-#Padding#)*#ScaleDpi#,(#height#+#Padding#+#Padding#)*#ScaleDpi#,(#height#+#Padding#+#Padding#)*#ScaleDpi#,(#radius#*#ScaleDpi#)

RightMouseUpAction=[!SkinCustomMenu]
ContextTitle=#Settings#
ContextAction=["#@#Config.exe" #Type# "#CURRENTCONFIG#" "#CURRENTFILE#" "#SETTINGSPATH#" "#SKINSPATH#" "#PROGRAMPATH#" "#scaledpi#"]

ContextTitle2=#Alternative#
ContextAction2=[!ActivateConfig "#CURRENTCONFIG#"]
ContextTitle3=#Close#
ContextAction3=[!DeactivateConfig]
ContextTitle4=----
ContextAction4=[]
ContextTitle5=#AddItems#
ContextAction5=[!ActivateConfig "BigSur\Gallery" "Gallery.ini"]
ContextTitle6=----
ContextAction6=[]
ContextTitle7=#MoreActions#
ContextAction7=[!SkinMenu]

[Metadata]
Version=1.5.0
Information=BigSur 27 for Rainmeter
License=Creative Commons Attribution-Noncommercial-Share Alike 3.0 License

 


 [Variables] 
Type=Regular
@include=#@#Global.inc
@include1=#@#Languages\#MainLanguage#.inc
@include2=#@#\Structure\#Type#\Type.inc
@include3=UserVariables.inc
Height=160

@include4=Extra.inc

[MeasureDay]
Measure=TIME
Format=%d
;TimeZone=#_TimeZone#
DaylightSavingTime=#_DayLightSavingsTime#

[MeasureMonth]
Measure=TIME
Format=%m
;TimeZone=#_TimeZone#
DaylightSavingTime=#_DayLightSavingsTime#

[MeasureYear]
Measure=TIME
Format=%Y
;TimeZone=#_TimeZone#
[MeasureLuaScript]
Measure=SCRIPT
ScriptFile=#CURRENTPATH#Sun.lua


[MeasureSunState]
Measure=Script
ScriptFile=SunState.lua
UpdateDivider=60

[measurefunnythings]
Measure=Calc
Formula=-1*#ShowSunrise#+1
DymamicVariables=1


[img]
meter=Image
imagename=SunsetB0.png
meterstyle=full
Group=Sunset
Hidden=1

[img2]
meter=Image
imagename=SunriseB1.png
meterstyle=full
Group=Sunrise
Hidden=1


[ico]
meter=Image
imagename=2.png
meterstyle=Icon
X=(25*#scaledpi#)
Y=(22*#scaledpi#)
W=(22*#scaledpi#)
H=(22*#scaledpi#)

[Arrow]
Meter=Image
ImageName=Arrow.png
meterstyle=Icon
X=(25*#scaledpi#)
Y=(22*#scaledpi#)
W=(22*#scaledpi#)
H=(22*#scaledpi#)
Group=Sunset
Hidden=1

[ArrowUp]
Meter=Image
ImageName=ArrowUp.png
meterstyle=Icon
X=(25*#scaledpi#)
Y=(22*#scaledpi#)
W=(22*#scaledpi#)
H=(22*#scaledpi#)
Group=Sunrise
Hidden=1

[Sunrise]
Meter=String
Text=Sunsire
Group=Sunrise
X=(46*#scaledpi#)
Y=(26*#scaledpi#)
FontColor=#textcolor2#,#textopacity#
InlineSetting=#InlineShadow#
FontSize=(12)*#scaledpi#
AntiAlias=1
FontWeight=700
stringcase=upper
StringAlign=left
Hidden=1

[Sunset]
Meter=String
Group=Sunset
Text=Sunset
X=(46*#scaledpi#)
Y=(26*#scaledpi#)
FontColor=#textcolor2#,#textopacity#
InlineSetting=#InlineShadow#
FontSize=(12)*#scaledpi#
AntiAlias=1
FontWeight=700
stringcase=upper
StringAlign=left
Hidden=1

[SunSetTime]
Meter=String
Text=#_Set#
DynamicVariables=1
X=(25*#scaledpi#)
Y=(50*#scaledpi#)
FontColor=#textcolor2#
InlineSetting=#InlineShadow#
FontSize=(20)*#scaledpi#
AntiAlias=1
FontWeight=700
StringAlign=left
Group=Sunset
Hidden=1


[SunRiseTime]
Meter=String
Text=#_Rise#
DynamicVariables=1
Text=Sunsire
X=(25*#scaledpi#)
Y=(50*#scaledpi#)
FontColor=#textcolor2#
InlineSetting=#InlineShadow#
FontSize=(20)*#scaledpi#
AntiAlias=1
FontWeight=700
Group=Sunrise
StringAlign=left
Hidden=1



[SunSet2]
Meter=String
Text=Sunrise: #_Rise#
DynamicVariables=1
X=(25*#scaledpi#)
Y=(142*#scaledpi#)
FontColor=#textcolor2#
InlineSetting=#InlineShadow#
FontSize=(10)*#scaledpi#
AntiAlias=1
FontWeight=600
StringAlign=left
Group=Sunset

[SunRise2]
Meter=String
Text=Sunset: #_Set#
DynamicVariables=1
X=(25*#scaledpi#)
Y=(142*#scaledpi#)
FontColor=#textcolor2#
InlineSetting=#InlineShadow#
FontSize=(10)*#scaledpi#
AntiAlias=1
FontWeight=600
StringAlign=left
Group=Sunrise


[Text]
Meter=String
Text=#Sunset#
Hidden=1
FontColor=#LabelColor#,#LabelOpacity#
MeterStyle=Text
Antialias=1
Group=Sunset


[Text2]
Meter=String
Text=#Sunrise#
DynamicVariables=1
MeterStyle=Text
Antialias=1
Hidden=1
FontColor=#LabelColor#,#LabelOpacity#
Group=Sunrise