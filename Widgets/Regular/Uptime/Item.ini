[Rainmeter]
DragGroup=BigSur
Group=Widget | BigSur
Author=Xyrfo and fediaFedia
OnRefreshAction=[!SetTransparency "#opacity#"]
MouseActionCursor=0
MiddleMouseUpAction=!DeactivateConfig
Update=60000

Blur=#globalblurenable#
BlurRegion=2,(11-#Padding#)*#ScaleDpi#,(10-#Padding#)*#ScaleDpi#,(#height#+#Padding#+#Padding#)*#ScaleDpi#,(#height#+#Padding#+#Padding#)*#ScaleDpi#,(#radius#*#ScaleDpi#)

RightMouseUpAction=[!SkinCustomMenu]
ContextTitle=#Settings#
ContextAction=["#@#Config.exe" #Type# "#CURRENTCONFIG#" "#CURRENTFILE#" "#SETTINGSPATH#" "#SKINSPATH#" "#PROGRAMPATH#" "#scaledpi#"]
ContextTitle2=#Close#
ContextAction2=[!DeactivateConfig]
ContextTitle3=----
ContextAction3=[]
ContextTitle4=#Hibernate#
ContextAction4=["#currentpath#Hibernate.lnk"]
ContextTitle5=#LogOff#
ContextAction5=["#currentpath#LogOff.lnk]
ContextTitle6=#Lock#
ContextAction6=["#currentpath#Lock.lnk"]
ContextTitle7=#Restart#
ContextAction7=["#currentpath#Restart.lnk"]
ContextTitle8=#Sleep#
ContextAction8=["#currentpath#Sleep.lnk"]
ContextTitle9=#Shutdown#
ContextAction9=["#currentpath#Sleep.lnk"]

[Metadata]
Version=1.5.0
Information=BigSur 27 for Rainmeter
License=Creative Commons Attribution-Noncommercial-Share Alike 3.0 License

 
 [Variables] 
Type=Regular
@include=#@#Global.inc
@include1=#@#Languages\#MainLanguage#.inc
@include2=#@#\Structure\#Type#\Type.inc
@include3=UserVariables.inc
Name=Screen Time


[MeasureWe]
Measure=Time
Format=%A


[Data1]
Meter=Image
ImageName=Data.png
MeterStyle=Full

[Data2]
Meter=Image
ImageName=[MeasureWe].png
MeterStyle=Full
DynamicVariables=1

[MeasureUptime]
Measure=Uptime
Format="%3!02i!h %2!02im!"


[MeasureUptime2]
Measure=Uptime
Format="%4!i! #days#"
Substitute="0 #days#":"", "1 day":"1 #day#"



[MeterTimer]
MeasureName=MeasureUptime
Meter=String
x=(#Height#/2.9)*#ScaleDpi#
Y=(#Height#/6)*#ScaleDpi#
StringStyle=Normal
StringAlign=Left
FontFace=Default
FontWeight=500
FontSize=(#Height#/10)*#ScaleDpi#
AntiAlias=1
FontColor=#TextColor2#,#textopacity#


[Sha]
Meter=Shape
Shape=Ellipse (38)*#scaledpi#,(40)*#scaledpi#,(14)*#scaledpi# | StrokeWidth 0 | Fill Color #textcolor2#,80
LeftMouseUpAction=[!SkinCustomMenu]
MouseActionCursor=1
[MeasureUserName]
Measure=Plugin
Plugin=Plugins\SysInfo.dll
SysInfoType=USER_NAME

[MeasureUserName2]
Measure=String
String=[MeasureUserName]
RegExpSubstitute=1
Substitute="^.{0}(.).*$":"\1"
DynamicVariables=1

[User]
MeasureName=MeasureUserName2
Meter=String
x=(38)*#ScaleDpi#
Y=(30)*#ScaleDpi#
StringStyle=Normal
StringAlign=center
FontFace=Default
FontWeight=500
FontSize=(#Height#/14)*#ScaleDpi#
AntiAlias=1
FontColor=#TextColor2#,#textopacity#
DynamicVariables=1
ToolTipText=Logged in as [MeasureUserName]
