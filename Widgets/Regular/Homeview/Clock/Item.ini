[Rainmeter]
DragGroup=BigSur
Group=Widget | BigSur
Author=Xyrfo and fediaFedia
OnRefreshAction=[!SetTransparency "#opacity#"]
MouseActionCursor=0
MiddleMouseUpAction=!DeactivateConfig
Update=60000

Blur=#globalblurenable#
BlurRegion=2,(11-#Padding#)*#ScaleDpi#,(15-#Padding#)*#ScaleDpi#,(#height#+#Padding#+#Padding#)*#ScaleDpi#,(#height#+#Padding#+#Padding#)*#ScaleDpi#,(#radius#*#ScaleDpi#)

RightMouseUpAction=[!SkinCustomMenu]
ContextTitle=#Settings#
ContextAction=["#@#Config.exe" #Type# "#CURRENTCONFIG#" "#CURRENTFILE#" "#SETTINGSPATH#" "#SKINSPATH#" "#PROGRAMPATH#" "#scaledpi#"]
ContextTitle2=#Close#
ContextAction2=[!DeactivateConfig]
ContextTitle3=----
ContextAction3=[]
ContextTitle4=#AddItems#
ContextAction4=[!ActivateConfig "BigSur\Gallery" "Gallery.ini"]
ContextTitle5=----
ContextAction5=[]
ContextTitle6=#MoreActions#
ContextAction6=[!SkinMenu]
[Metadata]
Version=1.5.0
Information=BigSur 27 for Rainmeter, Thanks to Brian https://forum.rainmeter.net/viewtopic.php?p=203714#p203694
License=Creative Commons Attribution-Noncommercial-Share Alike 3.0 License

 
 [Variables] 
@include1=#@#Global.inc
@include2=#@#Languages\#MainLanguage#.inc
@include3=#@#\Structure\#Type#\Type.inc
@include4=UserVariables.inc
Name=#Greeter#
textcolor2=255,255,255
ColorSkin=30,30,30
ProfileBaseImageSize=1080


Height=160
heightE=160
ClockStyle=Default
StrokeOpacity=0
StrokeColor=255,255,255,0


[LiquidGlass]
Measure=Plugin
Plugin=#BlurMode#
Blur=14
Radius=28
Padding=30
Saturation=1.2
RefractionHeight=1.0
RefractionCorrect=1.0
Dispersion=2.0
Darkening=1
HighlightAlpha=0.0
ShadowAlpha=0.0
ShadowOffsetY=0
Tint=90,160,255,20
FPS=0
BlurRegion=2, (11-#Padding#)*#ScaleDpi#, (11-#Padding#)*#ScaleDpi#, (#height#+#Padding#+#Padding#)*#ScaleDpi#, (#height#+#Padding#+#Padding#)*#ScaleDpi#,(#radius#*4)*#ScaleDpi#
Disabled=#LiquidGlassDisabled#
MotionFPS=0


[GlassBlur]
Measure=Plugin
Plugin=GlassBlur
Type=Blur
; BlurRegion=Type, X, Y, Width, Height[, Radius] - Type 0 = whole skin, 1 = rectangle, 2 = rounded (overrides Radius)
BlurRegion=2, (11-#Padding#)*#ScaleDpi#, (11-#Padding#)*#ScaleDpi#, (#height#+#Padding#+#Padding#)*#ScaleDpi#, (#height#+#Padding#+#Padding#)*#ScaleDpi#,(#radius#*4)*#ScaleDpi#
Disabled=#BlurDisabled#



[Solid]
Meter=String
solidcolor=0,0,0,1
W=(#height#+(11-#Padding#)*2)*#ScaleDpi#
H=(#height#+(11-#Padding#)*2)*#ScaleDpi#
x=0
y=0

[MeasureTime]
Measure=Time

[MeasureTime1]
Measure=Time
Format=#clockName#


[face0]
Meter=Image
ImageName=#@#Graphics\Clock\clock#clockstyle#Numbers.png

X=0
Y=0
W=(#height#+20)*#ScaleDpi#
H=(#height#+20)*#ScaleDpi#

imagetint=#textcolor2#,#textopacity#


[Hours]
Meter=ROTATOR
ImageName=#@#Graphics\Clock\scale\#scaledpi#\Hour12.png
ValueRemainder=43200
MeterStyle=Seconds
DynamicVariables=1
OffsetX=(#heightE#/2)*#scaledpi#
OffsetY=(#heightE#/2)*#scaledpi#
ImageTint=#textcolor2#,#textopacity#
X=(12*#scaledpi#)
Y=(12*#scaledpi#)

[Minutes]
Meter=ROTATOR
ImageName=#@#Graphics\Clock\scale\#scaledpi#\min12.png
MeterStyle=Seconds
LineWidtH=2
LineLengtH=20
LineLengtH=#heightE1#
LineColor=0,0,0
ValueRemainder=3600
ImageTint=#textcolor2#,#textopacity#
DynamicVariables=1
OffsetX=(#heightE#/2)*#scaledpi#
OffsetY=(#heightE#/2)*#scaledpi#
X=(12*#scaledpi#)
Y=(12*#scaledpi#)


[DotE]

Meter=Shape
Shape=Ellipse (((#heightE#/2+12)*#scaledpi#)-(1*#scaledpi#-(#padding#/2)/2)),(((#heightE#/2+12)*#scaledpi#)-(1*#scaledpi#-(#padding#/2)/2)),(3*#scaledpi#) | Fill Color 255,255,255,200 | StrokeWidth 0
Hidden=0

[Seconds]
Meter=ROTATOR
MeasureName=MeasureTime
ImageName=#@#Graphics\Clock\scale\#scaledpi#\secs1#ShowSeconds#.png
X=(12*#scaledpi#)
Y=(12*#scaledpi#)
W=(#heightE#)*#scaledpi#
LineLengtH=25
H=(#heightE#)*#scaledpi#
LineWidtH=1
LineLengtH=21
LineStart=0
AntiAlias=1
LineColor=255,0,0,100
Solid=0
ValueRemainder=60
OffsetX=(#heightE#/2)*#scaledpi#
OffsetY=(#heightE#/2)*#scaledpi#





