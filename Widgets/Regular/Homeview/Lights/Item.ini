[Rainmeter]
DragGroup=BigSur
Group=Widget | BigSur
Author=Xyrfo and fediaFedia
OnRefreshAction=[!SetTransparency "#opacity#"]
MouseActionCursor=0
MiddleMouseUpAction=!DeactivateConfig
Update=60000

Blur=#globalblurenable#
BlurRegion=2,(11-#Padding#)*#ScaleDpi#,(15-#Padding#)*#ScaleDpi#,(#height#+#Padding#+#Padding#)*#ScaleDpi#,(#height#+#Padding#+#Padding#)*#ScaleDpi#,(#radius#*#ScaleDpi#)

RightMouseUpAction=[!SkinCustomMenu]
ContextTitle=#Settings#
ContextAction=["#@#Config.exe" #Type# "#CURRENTCONFIG#" "#CURRENTFILE#" "#SETTINGSPATH#" "#SKINSPATH#" "#PROGRAMPATH#" "#scaledpi#"]
ContextTitle2=#Close#
ContextAction2=[!DeactivateConfig]
ContextTitle3=----
ContextAction3=[]
ContextTitle4=#AddItems#
ContextAction4=[!ActivateConfig "BigSur\Gallery" "Gallery.ini"]
ContextTitle5=----
ContextAction5=[]
ContextTitle6=#MoreActions#
ContextAction6=[!SkinMenu]
[Metadata]
Version=1.5.0
Information=BigSur 27 for Rainmeter, Thanks to Brian https://forum.rainmeter.net/viewtopic.php?p=203714#p203694
License=Creative Commons Attribution-Noncommercial-Share Alike 3.0 License

 
 [Variables] 
Type=Homeview
@include1=#@#Global.inc
@include2=#@#Languages\#MainLanguage#.inc
@include3=#@#\Structure\#Type#\Type.inc
@include4=UserVariables.inc
Name=#Greeter#
textcolor2=255,255,255
ColorSkin=30,30,30
ProfileBaseImageSize=1080


[USER_SID]
Measure=SysInfo
SysInfoType=USER_SID
IfMatch=^(S\-1\-5\-21\-[\S]+)$

