[Rainmeter]
DragGroup=BigSur
Group=Widget | BigSur
Author=Xyrfo and fediaFedia
OnRefreshAction=[!SetTransparency "#opacity#"]
MouseActionCursor=0
MiddleMouseUpAction=!DeactivateConfig
Update=#ShowSeconds#000

Blur=#globalblurenable#
BlurRegion=2,(11-#Padding#)*#ScaleDpi#,(10-#Padding#)*#ScaleDpi#,(#height#+#Padding#+#Padding#)*#ScaleDpi#,(#height#+#Padding#+#Padding#)*#ScaleDpi#,(#radius#*#ScaleDpi#)

RightMouseUpAction=[!SkinCustomMenu]
ContextTitle=#Settings#
ContextAction=["#@#Config.exe" #Type# "#CURRENTCONFIG#" "#CURRENTFILE#" "#SETTINGSPATH#" "#SKINSPATH#" "#PROGRAMPATH#" "#scaledpi#"]

ContextTitle2=#Alternative#
ContextAction2=[!ActivateConfig "#CURRENTCONFIG#"]
ContextTitle3=#Close#
ContextAction3=[!DeactivateConfig]
ContextTitle4=----
ContextAction4=[]
ContextTitle5=#AddItems#
ContextAction5=[!ActivateConfig "BigSur\Gallery" "Gallery.ini"]
ContextTitle6=----
ContextAction6=[]
ContextTitle7=#MoreActions#
ContextAction7=[!SkinMenu]

[Metadata]
Version=1.5.0
Information=BigSur 27 for Rainmeter
License=Creative Commons Attribution-Noncommercial-Share Alike 3.0 License

 
 [Variables] 
Type=Regular
@include=#@#Global.inc
@include1=#@#Languages\#MainLanguage#.inc
@include2=#@#\Structure\#Type#\Type.inc
@include3=UserVariables.inc

Height=160
heightE=160





[MeasureTime]
Measure=Time
TimeZone=#CityZone1#


[24Hour]
Measure=Time
Format=%H:%M
TimeZone=#CityZone1#


[CityName]
Measure=Time
Format=#CityName1#



[Text]
Meter=String
Text=#ClockName#
y=(#height#*1.08)*#ScaleDpi#
StringAlign=Center
w=(#height#)*#ScaleDpi#
x=(#height#/2+(11-#Padding#))*#ScaleDpi#
MeterStyle=FontStyle
Hidden=#HideLabels#
fontcolor=#LabelColor#,#LabelOpacity#
InlineSetting=#InlineShadow#
h=(#height#/9)*#scaledpi#
DynamicVariables=1

[s1]
Measure=Calc
Formula=1
RegExpSubstitute=1
Substitute="1":"#CityName1#","^(...).*$":"\1"

[Name]
Meter=String
MeasureName=s1
MeterStyle=Style
y=(#height#*0.42)*#ScaleDpi#
x=(#height#/2+(11-#Padding#))*#ScaleDpi#
StringAlign=CENTER
StringStyle=Bold
FontFace=#ThemeFont#
InlineSetting=#InlineShadow#
FontSize=((#heightE#/13))*#scaledpi#
AntiAlias=1
stringcase=upper
fontcolor=#textcolor2#,100

[Zone]
Meter=String
Text=#CityZone1# HRS
MeterStyle=Style
y=(#height#*0.65)*#ScaleDpi#
x=(#height#/2+(11-#Padding#))*#ScaleDpi#
StringAlign=CENTER
StringStyle=Bold
FontFace=#ThemeFont#
InlineSetting=#InlineShadow#
FontSize=((#height#/16))*#scaledpi#
AntiAlias=1
fontcolor=#textcolor2#,100

[Rainmeter]
DragGroup=BigSur
Group=Widget | BigSur
Author=Xyrfo and fediaFedia
OnRefreshAction=[!SetTransparency "#opacity#"]
MouseActionCursor=0
MiddleMouseUpAction=!DeactivateConfig
Update=#ShowSeconds#000

Blur=#globalblurenable#
BlurRegion=2,(11-#Padding#)*#ScaleDpi#,(10-#Padding#)*#ScaleDpi#,(#height#+#Padding#+#Padding#)*#ScaleDpi#,(#height#+#Padding#+#Padding#)*#ScaleDpi#,(#radius#*#ScaleDpi#)

RightMouseUpAction=[!SkinCustomMenu]
ContextTitle=#Settings#
ContextAction=["#@#Config.exe" #Type# "#CURRENTCONFIG#" "#CURRENTFILE#" "#SETTINGSPATH#" "#SKINSPATH#" "#PROGRAMPATH#" "#scaledpi#"]

ContextTitle2=#Alternative#
ContextAction2=[!ActivateConfig "#CURRENTCONFIG#"]
ContextTitle3=#Close#
ContextAction3=[!DeactivateConfig]
ContextTitle4=----
ContextAction4=[]

ContextTitle5=#TimeZoneClock#
ContextAction5=[!ActivateConfig "BigSur\Widgets\Regular\ClockTimezone" "Item.ini"]

ContextTitle6=#AddItems#
ContextAction6=[!ActivateConfig "BigSur\Gallery" "Gallery.ini"]
ContextTitle7=----
ContextAction7=[]
ContextTitle8=#MoreActions#
ContextAction8=[!SkinMenu]

[Metadata]
Version=1.5.0
Information=BigSur 27 for Rainmeter
License=Creative Commons Attribution-Noncommercial-Share Alike 3.0 License

 
 [Variables] 
Type=Regular
@include=#@#Global.inc
@include1=#@#Languages\#MainLanguage#.inc
@include2=#@#\Structure\#Type#\Type.inc
@include3=UserVariables.inc

Height=160
heightE=160



[MeasureTime]
Measure=Time

[MeasureTime1]
Measure=Time
Format=#clockName#

[face]
Meter=Image
ImageName=#@#Graphics\Clock\clock#clockstyle##DarkMode#.png

MEterStyle=Full

[face0]
Meter=Image
ImageName=#@#Graphics\Clock\clock#clockstyle#Numbers.png

MEterStyle=Full
imagetint=#textcolor2#,#textopacity#


[Hours]
Meter=ROTATOR
ImageName=#@#Graphics\Clock\scale\#scaledpi#\Hour12.png
ValueRemainder=43200
MeterStyle=Seconds
DynamicVariables=1
OffsetX=(#heightE#/2)*#scaledpi#
OffsetY=(#heightE#/2)*#scaledpi#
ImageTint=#textcolor2#,#textopacity#
X=(12*#scaledpi#)
Y=(12*#scaledpi#)

[Minutes]
Meter=ROTATOR
ImageName=#@#Graphics\Clock\scale\#scaledpi#\min12.png
MeterStyle=Seconds
LineWidtH=2
LineLengtH=20
LineLengtH=#heightE1#
LineColor=0,0,0
ValueRemainder=3600
ImageTint=#textcolor2#,#textopacity#
DynamicVariables=1
OffsetX=(#heightE#/2)*#scaledpi#
OffsetY=(#heightE#/2)*#scaledpi#
X=(12*#scaledpi#)
Y=(12*#scaledpi#)


[DotE]

Meter=Shape
Shape=Ellipse (((#heightE#/2+12)*#scaledpi#)-(1*#scaledpi#-(#padding#/2)/2)),(((#heightE#/2+12)*#scaledpi#)-(1*#scaledpi#-(#padding#/2)/2)),(3*#scaledpi#) | Fill Color 255,255,255,200 | StrokeWidth 0
Hidden=0

[Seconds]
Meter=ROTATOR
MeasureName=MeasureTime
ImageName=#@#Graphics\Clock\scale\#scaledpi#\secs1#ShowSeconds#.png
X=(12*#scaledpi#)
Y=(12*#scaledpi#)
W=(#heightE#)*#scaledpi#
LineLengtH=25
H=(#heightE#)*#scaledpi#
LineWidtH=1
LineLengtH=21
LineStart=0
AntiAlias=1
LineColor=255,0,0,100
Solid=0
ValueRemainder=60
OffsetX=(#heightE#/2)*#scaledpi#
OffsetY=(#heightE#/2)*#scaledpi#






[s1]
Measure=Calc
Formula=1
RegExpSubstitute=1
Substitute="1":"#CityName1#","^(...).*$":"\1"


[measurefunnythings]
Measure=Calc
Formula=-1*#ShowSeconds#+1
DymamicVariables=1

[Dot]

Meter=Shape
Shape=Ellipse (((#heightE#/2+12)*#scaledpi#)-(1*#scaledpi#-(#padding#/2)/2)),(((#heightE#/2+12)*#scaledpi#)-(1*#scaledpi#-(#padding#/2)/2)),(2*#scaledpi#) | Fill Color 250,160,14 | StrokeWidth 0
Hidden=[measurefunnythings]
DynamicVariables=1