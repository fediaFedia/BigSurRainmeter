[Rainmeter]
DragGroup=BigSur
Group=Widget | BigSur
Author=Xyrfo and fediaFedia
OnRefreshAction=[!SetTransparency "#opacity#"]
MouseActionCursor=0
MiddleMouseUpAction=!DeactivateConfig
Update=-1

Blur=#globalblurenable#
BlurRegion=2,(11-#Padding#)*#ScaleDpi#,(10-#Padding#)*#ScaleDpi#,(#height#+#Padding#+#Padding#)*#ScaleDpi#,(#height#+#Padding#+#Padding#)*#ScaleDpi#,(#radius#*#ScaleDpi#)

RightMouseUpAction=[!SkinCustomMenu]
ContextTitle=#Settings#
ContextAction=["#@#Config.exe" #Type# "#CURRENTCONFIG#" "#CURRENTFILE#" "#SETTINGSPATH#" "#SKINSPATH#" "#PROGRAMPATH#" "#scaledpi#"]

ContextTitle2=#Alternative#
ContextAction2=[!ActivateConfig "#CURRENTCONFIG#"]
ContextTitle3=#Close#
ContextAction3=[!DeactivateConfig]
ContextTitle4=----
ContextAction4=[]
ContextTitle5=#AddItems#
ContextAction5=[!ActivateConfig "BigSur\Gallery" "Gallery.ini"]
ContextTitle6=----
ContextAction6=[]
ContextTitle7=#MoreActions#
ContextAction7=[!SkinMenu]

[Metadata]
Version=1.5.0
Information=BigSur 27 for Rainmeter
License=Creative Commons Attribution-Noncommercial-Share Alike 3.0 License

 


 [Variables] 
Type=Regular
@include=#@#Global.inc
@include1=#@#Languages\#MainLanguage#.inc
@include2=#@#\Structure\#Type#\Type.inc
@include3=UserVariables.inc
Name=#Switches#
Height=160
Ding=1


[barsStyle]
SolidColor=#textcolor2#,1
W=(58)*#scaledpi#
H=(8)*#scaledpi#
X=r
Y=-R
AntiAlias=1

LeftMouseUpAction=[!CommandMeasure MeasureBacklight "SetBacklight #CurrentSection#"][!Update]
MouseActionCursor=1

[bgEd]
Meter=Image
ImageName=bgD.png
MeterStyle=Full
imagetint=#textcolor2#



[MeasureBacklight]
Measure=Plugin
Plugin=Backlight
;Policy=ForceLevel
;Removable
;Monitor=0
Monitor=-1
Divide=10
Showlog=0

[MeasureOne]
Measure=Calc
Formula=MeasureBacklight
dynamicvariables=1





[solcheck]
meter=string
x=(98)*#scaledpi#
y=(160 - [MeasureOne] * 1.33)*#scaledpi#
W=(58)*#scaledpi#
h=([MeasureOne] * 1.33)*#scaledpi#
solidcolor=#textcolor2#,#SliderOpacity#

dynamicvariables=1
Container=MeterContainer6

[MeterContainer6]
Meter=Shape
Shape=Rectangle (98)*#scaledpi#,(28)*#scaledpi#,(57)*#scaledpi#,(128)*#scaledpi#,(30*#scaledpi#) | Fill Color 255,47,47,200 | StrokeWidth 0
X=0
Y=0
DynamicVariables=1



[100]
Meter=Image
MeterStyle=barsStyle
x=(100)*#scaledpi#
Y=(30)*#scaledpi#
h=(28)*#scaledpi#


[90]
Meter=Image
MeterStyle=barsStyle
x=(100)*#scaledpi#
Y=(58)*#scaledpi#

[80]
Meter=Image
MeterStyle=barsStyle


[70]
Meter=Image
MeterStyle=barsStyle


[60]
Meter=Image
MeterStyle=barsStyle


[50]
Meter=Image
MeterStyle=barsStyle


[40]
Meter=Image
MeterStyle=barsStyle


[30]
Meter=Image
MeterStyle=barsStyle


[20]
Meter=Image
MeterStyle=barsStyle


[10]
Meter=Image
MeterStyle=barsStyle
H=(11)*#scaledpi#

[0]
Meter=Image
MeterStyle=barsStyle
x=(100)*#scaledpi#
h=(28)*#scaledpi#
Y=(133)*#scaledpi#


Container=MeterContainer2





[MeasureWin7Audio]
Measure=Plugin
Plugin=Win7AudioPlugin.dll

[MeasureOne2]
Measure=Calc
Formula=MeasureWin7Audio
dynamicvariables=1


[barsStyle2]
SolidColor=#textcolor2#,1
W=(58)*#scaledpi#
H=(8)*#scaledpi#
X=r
Y=-R
AntiAlias=1

LeftMouseUpAction=[!CommandMeasure MeasureWin7Audio "setVolume #currentsection#"][#Ding#PLAY "%WINDIR%\Media\Windows ding.wav"][!Update]
MouseActionCursor=1

[MeterContainer3]
Meter=Shape
ShapeD=Rectangle (35)*#scaledpi#,(34)*#scaledpi#,(#Height#/2.7)*#scaledpi#,(#Height#/6.2*2)*#scaledpi#,(30*#scaledpi#) | Fill Color 255,47,47,255 | StrokeWidth 0
X=0
Y=0

[99]
Meter=Image
MeterStyle=barsStyle2
x=(30)*#scaledpi#
Y=(30)*#scaledpi#
h=(28)*#scaledpi#


[89]
