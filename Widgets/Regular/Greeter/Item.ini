[Rainmeter]
DragGroup=BigSur
Group=Widget | BigSur
Author=Xyrfo and fediaFedia
OnRefreshAction=[!SetTransparency "#opacity#"]
MouseActionCursor=0
MiddleMouseUpAction=!DeactivateConfig
Update=60000

Blur=#globalblurenable#
BlurRegion=2,(11-#Padding#)*#ScaleDpi#,(15-#Padding#)*#ScaleDpi#,(#height#+#Padding#+#Padding#)*#ScaleDpi#,(#height#+#Padding#+#Padding#)*#ScaleDpi#,(#radius#*#ScaleDpi#)

RightMouseUpAction=[!SkinCustomMenu]
ContextTitle=#Settings#
ContextAction=["#@#Config.exe" #Type# "#CURRENTCONFIG#" "#CURRENTFILE#" "#SETTINGSPATH#" "#SKINSPATH#" "#PROGRAMPATH#" "#scaledpi#"]
ContextTitle2=#Close#
ContextAction2=[!DeactivateConfig]
ContextTitle3=----
ContextAction3=[]
ContextTitle4=#AddItems#
ContextAction4=[!ActivateConfig "BigSur\Gallery" "Gallery.ini"]
ContextTitle5=----
ContextAction5=[]
ContextTitle6=#MoreActions#
ContextAction6=[!SkinMenu]
[Metadata]
Version=1.5.0
Information=BigSur 27 for Rainmeter, Thanks to Brian https://forum.rainmeter.net/viewtopic.php?p=203714#p203694
License=Creative Commons Attribution-Noncommercial-Share Alike 3.0 License

 
 [Variables] 
Type=Regular
@include1=#@#Global.inc
@include2=#@#Languages\#MainLanguage#.inc
@include3=#@#\Structure\#Type#\Type.inc
@include4=UserVariables.inc
Name=#Greeter#
textcolor2=255,255,255
ColorSkin=30,30,30
ProfileBaseImageSize=1080

[MeasureUserName]
Measure=Plugin
Plugin=Plugins\SysInfo.dll
SysInfoType=USER_NAME

[MeasureHour]
Measure=Time
Format=%H

[MeasureTimeOfDay]
Measure=Calc
Formula=(MeasureHour>3) && (MeasureHour<12) ? 1111 : ((MeasureHour>11) && (MeasureHour<18) ? 2222 : ((MeasureHour>17) && (MeasureHour<24) ? 3333 : 4444))
Substitute="1111":"#Goodmorning#", "2222": "#Goodafternoon#", "3333": "#Goodevening#", "4444": "#Greetings#"

[MeasureTimeOfDay1]
Measure=Calc
Formula=(MeasureHour>3) && (MeasureHour<12) ? 1111 : ((MeasureHour>11) && (MeasureHour<18) ? 2222 : ((MeasureHour>17) && (MeasureHour<24) ? 3333 : 4444))

[icon]
Meter=Image
MeterStyle=Full
ImageName=[MeasureTimeOfDay1]c0.png
DynamicVariables=1
LeftMouseUpAction=!execute ["#PanelAction#"]
Container=MeterContainer
Hidden=#ShowBackground#

[MeterContainer]
Meter=Shape
Shape=Rectangle (11-#Padding#)*#ScaleDpi#,(11-#Padding#)*#ScaleDpi#,(#height#+#Padding#+#Padding#)*#ScaleDpi#,(#height#+#Padding#+#Padding#)*#ScaleDpi#,(#radius#)*#ScaleDpi# | Fill Color 255,47,47,255 | StrokeWidth 0
X=0
Y=0

[OverlayM]
Meter=Image
MeterStyle=Overlay

[Greeting]
Meter=String
MeasureName=MeasureTimeOfDay
Y=((#Height#/1.5))*#scaledpi#
X=((#Height#/1.85+5))*#scaledpi#
StringAlign=CENTER
StringStyle=Normal
FontColor=#textcolor2#,200
FontFace=#ThemeFont#
InlineSetting=#InlineShadow#
FontSize=((#Height#/14))*#scaledpi#
AntiAlias=1
Postfix=,

[Name]
Meter=String
MeasureName=MeasureUserName
Text=#username#
MeterStyle=Style
Y=((#Height#/1.3))*#scaledpi#
X=((#Height#/1.85+5))*#scaledpi#
StringAlign=CENTER
StringStyle=Normal
FontColor=#textcolor2#,#textopacity#
FontFace=#ThemeFont#
InlineSetting=#InlineShadow#
FontSize=((#Height#/9))*#scaledpi#
AntiAlias=1



[USER_SID]
Measure=SysInfo
SysInfoType=USER_SID
IfMatch=^(S\-1\-5\-21\-[\S]+)$
IfMatchAction=[!EnableMeasure CurrentUserProfilePictureLocation]
RegExpSubstitute=1
Substitute="^0$":""

[CurrentUserProfilePictureLocation]
Measure=Registry
RegHKey=HKEY_LOCAL_MACHINE
RegKey=SOFTWARE\Microsoft\Windows\CurrentVersion\AccountPicture\Users\[USER_SID]
RegValue=Image#ProfileBaseImageSize#
DynamicVariables=1
Disabled=0
IfMatch=(S\-1\-5\-21\-[\S]+)
IfMatchAction=[!SetOption ProfilePicture MeasureName "#CURRENTSECTION#"]
IfNotMatchAction=[!SetOption ProfilePicture MeasureName ""]

; Meters
[ProfilePicture]
Meter=Image
ImageName=profile.png
ImageTint=#IconTintSpecial#
Greyscale=#IconGreyscale#
W=(75)*#scaledpi#
H=(75)*#scaledpi#
X=(55)*#scaledpi#
Y=(30)*#scaledpi#
AntiAlias=1
Container=MeterContainer2
Hidden=#ShowUserPicture#
LeftMouseUpAction=!execute ["%USERPROFILE%"]
MouseActionCursor=1

[MeterContainer2]
Meter=Shape
Shape=Rectangle (55)*#scaledpi#,(30)*#scaledpi#,(75)*#scaledpi#,(75)*#scaledpi#,(#RoundUserPicture#)*#ScaleDpi# | Fill Color 255,47,47,255 | StrokeWidth 0
X=0
Y=0