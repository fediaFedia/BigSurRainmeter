[Rainmeter]
DragGroup=BigSur
Group=Widget | BigSur
Author=Xyrfo and fediaFedia
OnRefreshAction=[!SetTransparency "#opacity#"][!WriteKeyValue Variables CurrentItem "1" "#currentpath#UserVariables.inc"]
MouseActionCursor=0
MiddleMouseUpAction=!DeactivateConfig
Update=#ShowSeconds#000

Blur=#globalblurenable#
BlurRegion=2,(11-#Padding#)*#ScaleDpi#,(10-#Padding#)*#ScaleDpi#,(#height#+#Padding#+#Padding#)*#ScaleDpi#,(#height#+#Padding#+#Padding#)*#ScaleDpi#,(#radius#*#ScaleDpi#)

MouseOverAction=[!ShowMeter e][!ShowMeter hint][!Update]
MouseLeaveAction=[!HideMeter e][!HideMeter hint][!Update]



RightMouseUpAction=[!SkinCustomMenu]
ContextTitle=#Settings#
ContextAction=["#@#Config.exe" #Type# "#CURRENTCONFIG#" "#CURRENTFILE#" "#SETTINGSPATH#" "#SKINSPATH#" "#PROGRAMPATH#" "#scaledpi#"]
ContextTitle2=#Close#
ContextAction2=[!DeactivateConfig]
ContextTitle3=----
ContextAction3=[]
ContextTitle4=#EditSmartStack#
ContextAction4=[!ActivateConfig "#CURRENTCONFIG#" "Item.ini"]
ContextTitle5=----
ContextAction5=[]
ContextTitle6=#MoreActions#
ContextAction6=[!SkinMenu]

[Metadata]
Version=1.5.0
Information=BigSur 27 for Rainmeter
License=Creative Commons Attribution-Noncommercial-Share Alike 3.0 License

 

 [Variables] 
Type=Regular
@include=#@#Global.inc
@include1=#@#Languages\#MainLanguage#.inc
@include2=#@#\Structure\#Type#\Type.inc
@include3=#skinspath#\BigSur\Widgets\Regular\Clock\UserVariables.inc
@include4=#currentpath#UserVariables.inc
Name=#Clock#
Height=160
heightE=160
ShowSeconds=60
HideHint=0



[e]
meter=image
imagename=e.png
w=(180)*#scaledpi#
h=(180)*#scaledpi#
Hidden=1
imagetint=#textcolor2#,#textopacity#
MouseScrollUpAction=[!WriteKeyValue Variables HideHint 1][!CommandMeasure Script "Scroll(1)"][!WriteKeyValue Variables CurrentItemD "9" "#currentpath#UserVariables.inc"]
MouseScrollDownAction=[!WriteKeyValue Variables HideHint 1][!CommandMeasure Script "Scroll(-1)"][!WriteKeyValue Variables CurrentItemD "2" "#currentpath#UserVariables.inc"]


[Script]
Measure=Script
ScriptFile=Scroll.lua




[MeasureTime]
Measure=Time

[MeasureTime1]
Measure=Time
Format=#clockName#


[face]
Meter=Image
ImageName=#@#Graphics\Clock\clock#clockstyle##DarkMode#.png

MEterStyle=Full

[face0]
Meter=Image
ImageName=#@#Graphics\Clock\clock#clockstyle#Numbers.png

MEterStyle=Full
imagetint=#textcolor2#,#textopacity#


[Hours]
Meter=ROTATOR
ImageName=#@#Graphics\Clock\scale\#scaledpi#\Hour12.png
ValueRemainder=43200
MeterStyle=Seconds
DynamicVariables=1
OffsetX=(#heightE#/2)*#scaledpi#
OffsetY=(#heightE#/2)*#scaledpi#
ImageTint=#textcolor2#,#textopacity#
X=(12*#scaledpi#)
Y=(12*#scaledpi#)

[Minutes]
Meter=ROTATOR
ImageName=#@#Graphics\Clock\scale\#scaledpi#\min12.png
MeterStyle=Seconds
LineWidtH=2
LineLengtH=20
LineLengtH=#heightE1#
LineColor=0,0,0
ValueRemainder=3600
ImageTint=#textcolor2#,#textopacity#
DynamicVariables=1
OffsetX=(#heightE#/2)*#scaledpi#
OffsetY=(#heightE#/2)*#scaledpi#
X=(12*#scaledpi#)
Y=(12*#scaledpi#)


[DotE]

Meter=Shape
Shape=Ellipse (((#heightE#/2+12)*#scaledpi#)-(1*#scaledpi#-(#padding#/2)/2)),(((#heightE#/2+12)*#scaledpi#)-(1*#scaledpi#-(#padding#/2)/2)),(3*#scaledpi#) | Fill Color 255,255,255,200 | StrokeWidth 0
Hidden=0

[Seconds]
Meter=ROTATOR
MeasureName=MeasureTime
ImageName=#@#Graphics\Clock\scale\#scaledpi#\secs1#ShowSeconds#.png
X=(12*#scaledpi#)
Y=(12*#scaledpi#)
W=(#heightE#)*#scaledpi#
LineLengtH=25
H=(#heightE#)*#scaledpi#
LineWidtH=1
LineLengtH=21
LineStart=0
AntiAlias=1
LineColor=255,0,0,100
Solid=0
ValueRemainder=60
OffsetX=(#heightE#/2)*#scaledpi#
OffsetY=(#heightE#/2)*#scaledpi#






[s1]
Measure=Calc
Formula=1
RegExpSubstitute=1
Substitute="1":"#CityName1#","^(...).*$":"\1"


[measurefunnythings]
Measure=Calc
Formula=-1*#ShowSeconds#+1
DymamicVariables=1

[Dot]

Meter=Shape
Shape=Ellipse (((#heightE#/2+12)*#scaledpi#)-(1*#scaledpi#-(#padding#/2)/2)),(((#heightE#/2+12)*#scaledpi#)-(1*#scaledpi#-(#padding#/2)/2)),(2*#scaledpi#) | Fill Color 250,160,14 | StrokeWidth 0
Hidden=[measurefunnythings]
DynamicVariables=1

[hint]
meter=image
imagename=hint#HideHint#.png
MEterStyle=Full
imagetint=#textcolor2#,#textopacity#
Hidden=1
