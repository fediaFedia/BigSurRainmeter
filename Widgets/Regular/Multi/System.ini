[Rainmeter]
DragGroup=BigSur
Group=Widget | BigSur
Author=Xyrfo and fediaFedia
OnRefreshAction=[!SetTransparency "#opacity#"][!WriteKeyValue Variables CurrentItem "8" "#currentpath#UserVariables.inc"]
MouseActionCursor=0
MiddleMouseUpAction=!DeactivateConfig
Update=2000

Blur=#globalblurenable#
BlurRegion=2,(11-#Padding#)*#ScaleDpi#,(10-#Padding#)*#ScaleDpi#,(#height#+#Padding#+#Padding#)*#ScaleDpi#,(#height#+#Padding#+#Padding#)*#ScaleDpi#,(#radius#*#ScaleDpi#)

RightMouseUpAction=[!SkinCustomMenu]
ContextTitle=#Settings#
ContextAction=["#@#Config.exe" #Type# "#CURRENTCONFIG#" "#CURRENTFILE#" "#SETTINGSPATH#" "#SKINSPATH#" "#PROGRAMPATH#" "#scaledpi#"]
ContextTitle2=#Close#
ContextAction2=[!DeactivateConfig]
ContextTitle3=----
ContextAction3=[]
ContextTitle4=#EditSmartStack#
ContextAction4=[!ActivateConfig "#CURRENTCONFIG#" "Item.ini"]
ContextTitle5=----
ContextAction5=[]
ContextTitle6=#MoreActions#
ContextAction6=[!SkinMenu]


MouseOverAction=[!ShowMeter e][!Redraw]
MouseLeaveAction=[!HideMeter e][!Redraw]

[Metadata]
Version=1.5.0
Information=BigSur 27 for Rainmeter
License=Creative Commons Attribution-Noncommercial-Share Alike 3.0 License

 
 [Variables] 
Type=Regular
@include=#@#Global.inc
@include1=#@#Languages\#MainLanguage#.inc
@include2=#@#\Structure\#Type#\Type.inc
@include3=#skinspath#\BigSur\Widgets\Regular\System\UserVariables.inc
@include4=UserVariables.inc
Name=#System#




Height=160


[Script]
Measure=Script
ScriptFile=Scroll.lua


[scroll]
meter=image
w=(160)*#scaledpi#
h=(160)*#scaledpi#
solidcolor=0,0,0,1
MouseScrollUpAction=[!CommandMeasure Script "Scroll(1)"][!WriteKeyValue Variables CurrentItemD "7" "#currentpath#UserVariables.inc"]
MouseScrollDownAction=[!CommandMeasure Script "Scroll(-1)"][!WriteKeyValue Variables CurrentItemD "9" "#currentpath#UserVariables.inc"]
DynamicVariables=1



[MeasureCPU]
Measure=CPU


[MeasureRAM]
Measure=PhysicalMemory

[MeasureHDD]
Measure=FreeDiskSpace
Drive=C:
Label=1

[MeasureFreeDiskSpace]
Measure=FreeDiskSpace
Drive=C:
UpdateDivider=5


[MeasureUsedDiskSpace]
Measure=FreeDiskSpace
Drive=C:
InvertMeasure=1
UpdateDivider=5


[CPULineTotal]
Meter=ROUNDLINE
MeasureName=MeasureCPUTotal
X=(10)*#scaledpi#
Y=(10)*#scaledpi#
W=((100))*#scaledpi#
H=((100))*#scaledpi#
LineWidtH=1
StartAngle=6.40
RotationAngle=6.2831853
LineLengtH=(100/3.3)*#scaledpi#
LineStart=(100/3-10)*#scaledpi#
DynamicVariables=1
LineColor=#Color1#,50
Solid=1
AntiAlias=1


[CPULine]
Meter=ROUNDLINE
MeasureName=MeasureCPU
X=(10)*#scaledpi#
Y=(10)*#scaledpi#
W=((100))*#scaledpi#
H=((100))*#scaledpi#
LineWidtH=1
StartAngle=6.40
RotationAngle=6.2831853
LineLengtH=(100/3.3)*#scaledpi#
LineStart=(100/3-10)*#scaledpi#
DynamicVariables=1
LineColor=#Color1#,#textopacity#
Solid=1
AntiAlias=1

[MeterGraphTotal]
Meter=ROUNDLINE
MeasureName=MeasureCPUTotal
X=(10)*#scaledpi#
Y=(10)*#scaledpi#
W=((100))*#scaledpi#
H=((100))*#scaledpi#
LineWidtH=1
StartAngle=6.40
RotationAngle=6.2831853
LineLengtH=(100/4.6)*#scaledpi#
LineStart=(100/4-10)*#scaledpi#
DynamicVariables=1
LineColor=#Color2#,50
Solid=1
AntiAlias=1

[MeterGraph]
