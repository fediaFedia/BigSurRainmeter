[Sys]

FontFace=#ThemeFont#
InlineSetting=#InlineShadow#
FontSize=(12)*#scaledpi#
fontcolor=100,0,100
antialias=1
stringalign=left

x=r
y=(-2)*#scaledpi#R


[1]
Meter=String
MeterStyle=Sys
MeasureName=MeasureCPU
Text=CPU %1%
FontColor=#Color1#,#textopacity#
X=(28)*#scaledpi#
Y=(100)*#scaledpi#
Percentual=1
InlineSetting=#InlineShadow#
[2]
Meter=String
MeterStyle=Sys
MeasureName=MeasureRAM
Text=RAM %1%
FontColor=#Color2#,#textopacity#
Percentual=1
InlineSetting=#InlineShadow#
[3]
Meter=String
MeterStyle=Sys
MeasureName=MeasureUsedDiskSpace
Text=#UseSSD# %1%
Percentual=1
DynamicVariables=1
FontColor=#Color3#,#textopacity#
InlineSetting=#InlineShadow#


[e]
meter=image
imagename=e.png
w=(183)*#scaledpi#
h=(183)*#scaledpi#
Hidden=1
imagetint=#textcolor2#