MeasureName=MeasureRAM
X=(10)*#scaledpi#
Y=(10)*#scaledpi#
W=((100))*#scaledpi#
H=((100))*#scaledpi#
LineWidtH=1
StartAngle=6.40
RotationAngle=6.2831853
LineLengtH=(100/4.6)*#scaledpi#
LineStart=(100/4-10)*#scaledpi#
DynamicVariables=1
LineColor=#Color2#,#textopacity#
Solid=1
AntiAlias=1


[MeterGraph2T]
Meter=ROUNDLINE
MeasureName=MeasureCPUTotal
X=(10)*#scaledpi#
Y=(10)*#scaledpi#
W=((100))*#scaledpi#
H=((100))*#scaledpi#
LineWidtH=1
StartAngle=6.40
RotationAngle=6.2831853
LineLengtH=(100/7.5)*#scaledpi#
LineStart=(100/6-10)*#scaledpi#
