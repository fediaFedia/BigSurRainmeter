[Rainmeter]
DragGroup=BigSur
Group=Widget | BigSur
Author=Xyrfo and fediaFedia
OnRefreshAction=[!SetTransparency "#opacity#"][!WriteKeyValue Variables CurrentItem "5" "#currentpath#UserVariables.inc"]
MouseActionCursor=0
MiddleMouseUpAction=!DeactivateConfig
Update=-1

Blur=#globalblurenable#
BlurRegion=2,(11-#Padding#)*#ScaleDpi#,(10-#Padding#)*#ScaleDpi#,(#height#+#Padding#+#Padding#)*#ScaleDpi#,(#height#+#Padding#+#Padding#)*#ScaleDpi#,(#radius#*#ScaleDpi#)

RightMouseUpAction=[!SkinCustomMenu]
ContextTitle=#Settings#
ContextAction=["#@#Config.exe" #Type# "#CURRENTCONFIG#" "#CURRENTFILE#" "#SETTINGSPATH#" "#SKINSPATH#" "#PROGRAMPATH#" "#scaledpi#"]
ContextTitle2=#Close#
ContextAction2=[!DeactivateConfig]
ContextTitle3=----
ContextAction3=[]
ContextTitle4=#EditSmartStack#
ContextAction4=[!ActivateConfig "#CURRENTCONFIG#" "Item.ini"]
ContextTitle5=----
ContextAction5=[]
ContextTitle6=#MoreActions#
ContextAction6=[!SkinMenu]


MouseOverAction=[!ShowMeter e][!Redraw]
MouseLeaveAction=[!HideMeter e][!Redraw]




[Metadata]
Version=1.5.0
Information=BigSur 27 for Rainmeter
License=Creative Commons Attribution-Noncommercial-Share Alike 3.0 License

 
 [Variables] 
Type=Regular
@include=#@#Global.inc
@include1=#@#Languages\#MainLanguage#.inc
@include2=#@#\Structure\#Type#\Type.inc
@include3=UserVariables.inc
@include4=#skinspath#\BigSur\Widgets\Regular\Toggles\UserVariables.inc
Name=#Switches#
Height=160
Ding=1
BluetoothEnabled=0
[Script]
Measure=Script
ScriptFile=Scroll.lua


[scroll]
meter=image
w=(160)*#scaledpi#
h=(160)*#scaledpi#
solidcolor=0,0,0,1
MouseScrollUpAction=[!CommandMeasure Script "Scroll(1)"][!WriteKeyValue Variables CurrentItemD "4" "#currentpath#UserVariables.inc"]
MouseScrollDownAction=[!CommandMeasure Script "Scroll(-1)"][!WriteKeyValue Variables CurrentItemD "6" "#currentpath#UserVariables.inc"]
DynamicVariables=1

[MeasureWin7Audio]
Measure=Plugin
Plugin=Win7AudioPlugin.dll

[MeasureOne2]
Measure=Calc
Formula=MeasureWin7Audio
dynamicvariables=1


[barsStyle2]
SolidColor=#textcolor2#,1
W=(58)*#scaledpi#
H=(8)*#scaledpi#
X=r
Y=-R
AntiAlias=1

LeftMouseUpAction=[!CommandMeasure MeasureWin7Audio "setVolume #currentsection#"][#Ding#PLAY "%WINDIR%\Media\Windows ding.wav"][!Update]
MouseActionCursor=1

[MeterContainer3]
Meter=Shape
ShapeD=Rectangle (35)*#scaledpi#,(34)*#scaledpi#,(#Height#/2.7)*#scaledpi#,(#Height#/6.2*2)*#scaledpi#,(30*#scaledpi#) | Fill Color 255,47,47,255 | StrokeWidth 0
X=0
Y=0

[99]
Meter=Image
MeterStyle=barsStyle2
x=(30)*#scaledpi#
Y=(30)*#scaledpi#
h=(28)*#scaledpi#


[89]
Meter=Image
MeterStyle=barsStyle2
x=((30)*#scaledpi#)
Y=(58)*#scaledpi#

[79]
Meter=Image
MeterStyle=barsStyle2


[69]
Meter=Image
MeterStyle=barsStyle2


[59]
Meter=Image
MeterStyle=barsStyle2


[49]
Meter=Image
MeterStyle=barsStyle2


[39]
Meter=Image
MeterStyle=barsStyle2


[29]
Meter=Image
MeterStyle=barsStyle2


[19]
Meter=Image
MeterStyle=barsStyle2


[9]
Meter=Image
MeterStyle=barsStyle2
H=(11)*#scaledpi#

[1]
Meter=Image
MeterStyle=barsStyle2
x=(30)*#scaledpi#
h=(28)*#scaledpi#
Y=(133)*#scaledpi#





[solcheck2]
meter=string
x=(28)*#scaledpi#
y=(160 - [MeasureOne2] * 1.33)*#scaledpi#
W=(58)*#scaledpi#
h=([MeasureOne2] * 1.33)*#scaledpi#
solidcolor=#textcolor2#,#SliderOpacity#

dynamicvariables=1
Container=MeterContainer5

[MeterContainer5]
Meter=Shape
Shape=Rectangle (28)*#scaledpi#,(28)*#scaledpi#,(56)*#scaledpi#,(128)*#scaledpi#,(30*#scaledpi#) | Fill Color 255,47,47,200 | StrokeWidth 0
X=0
Y=0
DynamicVariables=1







[bgEe]
Meter=Image
ImageName=sound.png
MeterStyle=Full
imagetint=#colorskin#,255



[Extra]
Meter=Image
ImageName=bg.png
MeterStyle=Full
imagetint=#textcolor2#,75
[Index1]
meter=Image
imagename=headphones.png
x=(107)*#scaledpi#
y=(35)*#scaledpi#
w=(40)*#scaledpi#
h=(40)*#scaledpi#
solidcolor=0,0,0,1
LeftMouseUpAction=[!ShowMeter Index2][!HideMeter Index1][!CommandMeasure "MeasureWin7Audio" "SetOutputIndex #OutputIndex1#"][!WriteKeyValue Variables Index1Hide 1][!WriteKeyValue Variables Index2Hide 0][!Update][!Redraw]
MouseActionCursor=1
ToolTipText=#SetOutput# #OutputIndex1#
DynamicVariables=1
Hidden=#Index1Hide#
imagetint=#colorskin#,255



[Index2]
meter=Image
imagename=speakers.png
x=(107)*#scaledpi#
y=(35)*#scaledpi#
w=(40)*#scaledpi#
h=(40)*#scaledpi#
solidcolor=0,0,0,1
LeftMouseUpAction=[!ShowMeter Index1][!HideMeter Index2][!CommandMeasure "MeasureWin7Audio" "SetOutputIndex #OutputIndex2#"][!WriteKeyValue Variables Index1Hide 0][!WriteKeyValue Variables Index2Hide 1][!Update][!Redraw]
MouseActionCursor=1
ToolTipText=#SetOutput# #OutputIndex2#
DynamicVariables=1
Hidden=#Index2Hide#
imagetint=#colorskin#,255


[MeasureBluetooth]
Measure=Plugin
Plugin=RunCommand
Program=Powershell
Parameter=#currentpath#ToggleBluetooth.ps1
OutputType=ANSI
State=Hide


[sol3]
meter=Image
imagename=bluetooth.png
x=(107)*#scaledpi#
y=(107)*#scaledpi#
w=(40)*#scaledpi#
h=(40)*#scaledpi#
solidcolor=0,0,0,1
LeftMouseUpAction=[!CommandMeasure MeasureBluetooth "Run"][!WriteKeyValue Variables BluetoothEnabled 0][!ShowMeter sol1][!Redraw]
MouseActionCursor=1
ToolTipText=#ToggleMute#
imagetint=#colorskin#,100


[sol1]
meter=Image
imagename=bluetooth.png
x=(107)*#scaledpi#
y=(107)*#scaledpi#
w=(40)*#scaledpi#
h=(40)*#scaledpi#
solidcolor=0,0,0,1
LeftMouseUpAction=[!CommandMeasure MeasureBluetooth "Run"][!WriteKeyValue Variables BluetoothEnabled 1][!HideMeter sol1][!Redraw]
MouseActionCursor=1
ToolTipText=#ToggleMute#
imagetint=#colorskin#,255
Hidden=#BluetoothEnabled#


[e]
meter=image
imagename=e.png
w=(183)*#scaledpi#
h=(183)*#scaledpi#
Hidden=1
imagetint=#textcolor2#