[Rainmeter]
DragGroup=BigSur
Group=Widget | BigSur
Author=Xyrfo and fediaFedia
OnRefreshAction=[!SetTransparency "#opacity#"][!WriteKeyValue Variables CurrentItem "4" "#currentpath#UserVariables.inc"]
MouseActionCursor=0
MiddleMouseUpAction=!DeactivateConfig
Update=60000

Blur=#globalblurenable#
BlurRegion=2,(11-#Padding#)*#ScaleDpi#,(10-#Padding#)*#ScaleDpi#,(#height#+#Padding#+#Padding#)*#ScaleDpi#,(#height#+#Padding#+#Padding#)*#ScaleDpi#,(#radius#*#ScaleDpi#)

RightMouseUpAction=[!SkinCustomMenu]
ContextTitle=#Settings#
ContextAction=["#@#Config.exe" #Type# "#CURRENTCONFIG#" "#CURRENTFILE#" "#SETTINGSPATH#" "#SKINSPATH#" "#PROGRAMPATH#" "#scaledpi#"]
ContextTitle2=#Close#
ContextAction2=[!DeactivateConfig]
ContextTitle3=----
ContextAction3=[]
ContextTitle4=#EditSmartStack#
ContextAction4=[!ActivateConfig "#CURRENTCONFIG#" "Item.ini"]
ContextTitle5=----
ContextAction5=[]
ContextTitle6=#MoreActions#
ContextAction6=[!SkinMenu]

MouseOverAction=[!ShowMeter e][!Redraw]
MouseLeaveAction=[!HideMeter e][!Redraw]

[Metadata]
Version=1.5.0
Information=BigSur 27 for Rainmeter
License=Creative Commons Attribution-Noncommercial-Share Alike 3.0 License

 
 [Variables] 
Type=Regular
@include=#@#Global.inc
@include1=#@#Languages\#MainLanguage#.inc
@include2=#@#\Structure\#Type#\Type.inc
@include3=#@#Config\Widgets\Regular\Clock\UserVariables.inc
@include4=#currentpath#\UserVariables.inc

Name=#NotesText#
Notes=Hey wrap it up Charles Dickens, you're not being paid by the word



Height=160
heightE=160


[Switch]
Measure=String
IfCondition=#NotesEnabled# > 254


[bgEe]
Meter=Image
ImageName=#skinspath#\BigSur\Widgets\Regular\Notes\notes.png
MeterStyle=Full
imagetint=#IconTint#
Greyscale=#IconGreyscale#
Container=MeterContainer

[bgEeSs]
Meter=Image
ImageName=#skinspath#\BigSur\Widgets\Regular\Notes\notes#IconGreyscale#.png
MeterStyle=Full
imagetint=#IconTint#
Greyscale=#IconGreyscale#
Container=MeterContainer

[MeterContainer]
Meter=Shape
Shape=Rectangle (11-#Padding#)*#ScaleDpi#,(11-#Padding#)*#ScaleDpi#,(#height#+#Padding#+#Padding#)*#ScaleDpi#,(#height#+#Padding#+#Padding#)*#ScaleDpi#,(#radius#)*#ScaleDpi# | Fill Color 255,47,47,255 | StrokeWidth 0
X=0
Y=0

[e]
meter=image
imagename=e.png
w=(183)*#scaledpi#
h=(183)*#scaledpi#
Hidden=1
imagetint=#textcolor2#,#textopacity#



[Script]
Measure=Script
ScriptFile=Scroll.lua


[scroll]
meter=image
w=(160)*#scaledpi#
h=(160)*#scaledpi#
solidcolor=0,0,0,1
MouseScrollUpAction=[!CommandMeasure Script "Scroll(1)"][!WriteKeyValue Variables CurrentItemD "3" "#currentpath#UserVariables.inc"]
MouseScrollDownAction=[!CommandMeasure Script "Scroll(-1)"][!WriteKeyValue Variables CurrentItemD "5" "#currentpath#UserVariables.inc"]
DynamicVariables=1

[Input1]
Measure=Plugin
Plugin=InputText.dll
SolidColor=#colorskin#
X=(25)*#scaledpi#
Y=(55)*#scaledpi#
W=(120)*#scaledpi#
H=(95)*#scaledpi#
Command1=[!WriteKeyValue Variables Notes "$UserInput$"][!Refresh #CURRENTCONFIG#] 
DefaultValue="#notes#"
StringStyle=NORMAL
AntiAlias=1
StringAlign=LEFTcenter
FontFace=#ThemeFont#
FontColor=#textcolor2#,#textopacity#
InlineSetting=#InlineShadow#
FontSize=(9)*#scaledpi#
FocusDismiss=1

[notesT]
meter=string
text=Notes
FontFace=#ThemeFont#
InlineSetting=#InlineShadow#
FontSize=(10)*#scaledpi#
fontcolor=255,255,255
antialias=1
clipstring=1

x=(25)*#scaledpi#
y=(18)*#scaledpi#

[notesStyl]

FontFace=#ThemeFont#
InlineSetting=#InlineShadow#
FontSize=(9)*#scaledpi#
fontcolor=#textcolor2#,#textopacity#
antialias=1
clipstring=1
stringalign=leftCenter
LeftMouseUpAction=!CommandMeasure Input#currentsection# "ExecuteBatch 1"
X=(25)*#scaledpi#
Y=(55)*#scaledpi#
W=(120)*#scaledpi#
H=(95)*#scaledpi#

[1]
Meter=String
Text=#notes#
X=(25)*#scaledpi#
Y=(95)*#scaledpi#
MeterStyle=notesStyl



[e]
meter=image
imagename=e.png
w=(183)*#scaledpi#
h=(183)*#scaledpi#
Hidden=1
imagetint=#textcolor2#