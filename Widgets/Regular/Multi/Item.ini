[Rainmeter]
DragGroup=BigSur
Group=Widget | BigSur
Author=Xyrfo and fediaFedia
OnRefreshAction=[!SetTransparency "#opacity#"]
MouseActionCursor=0
MiddleMouseUpAction=!DeactivateConfig
Update=-1


RightMouseUpAction=[!SkinCustomMenu]
ContextTitle=#Settings#
ContextAction=["#@#Config.exe" #Type# "#CURRENTCONFIG#" "#CURRENTFILE#" "#SETTINGSPATH#" "#SKINSPATH#" "#PROGRAMPATH#" "#scaledpi#"]
ContextTitle2=#Close#
ContextAction2=[!DeactivateConfig]
ContextTitle3=----
ContextAction3=[]
ContextTitle4=#EditSmartStack#
ContextAction4=[!ActivateConfig "#CURRENTCONFIG#" "Item.ini"]
ContextTitle5=----
ContextAction5=[]
ContextTitle6=#MoreActions#
ContextAction6=[!SkinMenu]

[Metadata]
Version=1.5.0
Information=BigSur 27 for Rainmeter
License=Creative Commons Attribution-Noncommercial-Share Alike 3.0 License





 
 [Variables] 
Type=Regular
@include=#@#Global.inc
@include1=#@#Languages\#MainLanguage#.inc
@include2=#@#\Structure\#Type#\Type.inc
@include3=#currentpath#\UserVariables.inc
Name=[OK]



[block]
w=(45)*#scaledpi#
h=(45)*#scaledpi#
X=3R
y=r

LeftMouseUpAction=!ToggleConfig "BigSur\Widgets\Regular\#currentsection#" "Item.ini"
ToolTipText=#currentsection#
imagename=#@#\Graphics\Thumbs\#DarkMode#\#currentsection#.png
MouseActionCursor=1

[ClockFunny]
Measure=Calc
Formula=55+150*#Item1Enabled#
DymamicVariables=1

[ClockFunny2]
Measure=Calc
Formula=-1*#Item1Enabled#+1
DymamicVariables=1


[Clock]
Meter=Image
MeterStyle=block
LeftMouseUpAction=!execute [!WriteKeyValue Variables Item1Enabled [ClockFunny2] "#currentpath#\UserVariables.inc"][!Refresh #CURRENTCONFIG#]
ImageAlpha=[ClockFunny]
DynamicVariables=1
x=22*#scaledpi#
y=22*#scaledpi#



