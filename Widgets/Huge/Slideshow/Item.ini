[Rainmeter]
DragGroup=BigSur
Group=Widget | BigSur
Author=Xyrfo and fediaFedia
OnRefreshAction=[!SetTransparency "#opacity#"]
MouseActionCursor=0
MiddleMouseUpAction=!DeactivateConfig
Update=60000

Blur=#globalblurenable#
BlurRegion=2,(11-#Padding#)*#ScaleDpi#,(10-#Padding#)*#ScaleDpi#,(#height#*2+20+#Padding#+#Padding#)*#ScaleDpi#,(#height#*2+30+#Padding#+#Padding#)*#ScaleDpi#,(#radius#*#ScaleDpi#)

RightMouseUpAction=[!SkinCustomMenu]
ContextTitle=#Settings#
ContextAction=["#@#Config.exe" #Type# "#CURRENTCONFIG#" "#CURRENTFILE#" "#SETTINGSPATH#" "#SKINSPATH#" "#PROGRAMPATH#" "#scaledpi#"]

ContextTitle2=#Alternative#
ContextAction2=[!ActivateConfig "#CURRENTCONFIG#"]
ContextTitle3=#Close#
ContextAction3=[!DeactivateConfig]
ContextTitle4=----
ContextAction4=[]
ContextTitle5=#AddItems#
ContextAction5=[!ActivateConfig "BigSur\Gallery" "Gallery.ini"]
ContextTitle6=----
ContextAction6=[]
ContextTitle7=#MoreActions#
ContextAction7=[!SkinMenu]

[Metadata]
Version=1.5.0
Information=BigSur 27 for Rainmeter
License=Creative Commons Attribution-Noncommercial-Share Alike 3.0 License

 
 [Variables] 


Type=Huge
@include=#@#Global.inc
@include1=#@#Languages\#MainLanguage#.inc
@include2=#@#\Structure\#Type#\Type.inc
@include3=UserVariables.inc


[Random]
Measure=Plugin
Plugin=Plugins\QuotePlugin.dll
PathName="#PicturesFolder#"
Subfolders=#subfolders#
FileFilter=*.jpg;*.gif;*.png;*.jpeg;*.bmp

[Image]
MeasureName=Random
Meter=Image
MeterStyle=Full
FileFilter=*.jpg;*.gif;*.png;*.jpeg;*.bmp
PreserveAspectRatio=#KeepAspectRatio#
LeftMouseUpAction=["[Random]"]
Container=MeterContainer
DynamicVariables=1
ImageTint=#ColorizeColor#
Greyscale=#Colorize#

[ResetColorize]
Measure=Calc
Formula=#Colorize#
IfCondition=ResetColorize < 1
IfTrueAction=[!WriteKeyValue Variables ColorizeColor "" "UserVariables.inc"][!SetOption Image ImageTint ""][!Update]


[MeterContainer]
Meter=Shape
Shape=Rectangle (13-#Padding#)*#ScaleDpi#,(13-#Padding#)*#ScaleDpi#,(342+#Padding#+#Padding#)*#ScaleDpi#,(349+#Padding#+#Padding#)*#ScaleDpi#,(#radius#)*#ScaleDpi#
X=0
Y=0


[FolderName]
Measure=String
String=[Random]
RegExpSubstitute=1
;Substitute="^.*[\/\\]":""
DynamicVariables=1
Substitute="[\\\/][^\\\/]+$":"", "^.*[\\\/]":""


[FileName]
Measure=String
String=[Random]
RegExpSubstitute=1
;Substitute="^.*[\/\\]":""
Substitute="^.*[\/\\]":"", "\.[^.]*$":""
DynamicVariables=1

[Text]
Meter=String
Text=#Show Filename#
DynamicVariables=1
y=((350+(13-#Padding#)))*#scaledpi#
StringAlign=Center
w=(342)*#scaledpi#
ClipString=1
x=(186)*#scaledpi#
MeterStyle=FontStyle
Hidden=#HideLabels#
fontcolor=#LabelColor#,#LabelOpacity#
InlineSetting=#InlineShadow#