[Rainmeter]
DragGroup=BigSur
Group=Widget | BigSur
Author=Xyrfo and fediaFedia
OnRefreshAction=[!SetTransparency "#opacity#"]
MouseActionCursor=0
MiddleMouseUpAction=!DeactivateConfig
Update=#ShowSeconds#000

Blur=#globalblurenable#
BlurRegion=2,(11-#Padding#)*#ScaleDpi#,(10-#Padding#)*#ScaleDpi#,(#height#+#Padding#+#Padding#)*#ScaleDpi#,(#height#+#Padding#+#Padding#)*#ScaleDpi#,(#radius#*#ScaleDpi#)

RightMouseUpAction=[!SkinCustomMenu]
ContextTitle=#Settings#
ContextAction=["#@#Config.exe" #Type# "#CURRENTCONFIG#" "#CURRENTFILE#" "#SETTINGSPATH#" "#SKINSPATH#" "#PROGRAMPATH#" "#scaledpi#"]

ContextTitle2=#Alternative#
ContextAction2=[!ActivateConfig "#CURRENTCONFIG#"]
ContextTitle3=#Close#
ContextAction3=[!DeactivateConfig]
ContextTitle4=----
ContextAction4=[]

ContextTitle5=#TimeZoneClock#
ContextAction5=[!ActivateConfig "BigSur\Widgets\Regular\ClockTimezone" "Item.ini"]

ContextTitle6=#AddItems#
ContextAction6=[!ActivateConfig "BigSur\Gallery" "Gallery.ini"]
ContextTitle7=----
ContextAction7=[]
ContextTitle8=#MoreActions#
ContextAction8=[!SkinMenu]

[Metadata]
Version=1.5.0
Information=BigSur 27 for Rainmeter
License=Creative Commons Attribution-Noncommercial-Share Alike 3.0 License

 
 [Variables] 
Type=Mini
@include=#@#Global.inc
@include1=#@#Languages\#MainLanguage#.inc
@include2=#@#\Structure\#Type#\Type.inc
@include3=UserVariables.inc
Name=#CityName1#
Height=160
heightE=70



[MeasureTime]
Measure=Time
TimeZone=#CityZone1#



[face]
Meter=Image
ImageName=#@#Graphics\Clock\clock#clockstyle##DarkMode#.png

MEterStyle=Full

[face0]
Meter=Image
ImageName=#@#Graphics\Clock\clock#clockstyle#Numbers.png

MEterStyle=Full
imagetint=#textcolor2#,#textopacity#


[Hours]
Meter=ROTATOR
ImageName=#@#Graphics\Clock\micro\#scaledpi#\Hour12.png
ValueRemainder=43200
MeterStyle=Seconds
DynamicVariables=1
OffsetX=(#heightE#/2)*#scaledpi#
OffsetY=(#heightE#/2)*#scaledpi#
ImageTint=#textcolor2#,#textopacity#
X=(11*#scaledpi#)
Y=(11*#scaledpi#)

[Minutes]
Meter=ROTATOR
ImageName=#@#Graphics\Clock\micro\#scaledpi#\min12.png
MeterStyle=Seconds
LineWidtH=2
LineLengtH=20
LineLengtH=#heightE1#
LineColor=0,0,0
ValueRemainder=3600
ImageTint=#textcolor2#,#textopacity#
DynamicVariables=1
OffsetX=(#heightE#/2)*#scaledpi#
OffsetY=(#heightE#/2)*#scaledpi#
X=(11*#scaledpi#)
Y=(11*#scaledpi#)


[DotE]

Meter=Shape
Shape=Ellipse (((#heightE#/2+12)*#scaledpi#)-(1*#scaledpi#-(#padding#/2)/2)),(((#heightE#/2+12)*#scaledpi#)-(1*#scaledpi#-(#padding#/2)/2)),(2*#scaledpi#) | Fill Color 255,255,255,200 | StrokeWidth 0
Hidden=0

[Seconds]
Meter=ROTATOR
MeasureName=MeasureTime
ImageName=#@#Graphics\Clock\micro\#scaledpi#\secs1#ShowSeconds#.png
X=(11*#scaledpi#)
Y=(11*#scaledpi#)
W=(#heightE#)*#scaledpi#
LineLengtH=25
H=(#heightE#)*#scaledpi#
LineWidtH=1
LineLengtH=21
LineStart=0
AntiAlias=1
LineColor=255,0,0,100
Solid=0
ValueRemainder=60
OffsetX=(#heightE#/2)*#scaledpi#
OffsetY=(#heightE#/2)*#scaledpi#






[s1]
Measure=Calc
Formula=1
RegExpSubstitute=1
Substitute="1":"#CityName1#","^(...).*$":"\1"


[measurefunnythings]
Measure=Calc
Formula=-1*#ShowSeconds#+1
DymamicVariables=1

[Dot]

Meter=Shape
Shape=Ellipse (((#heightE#/2+12)*#scaledpi#)-(1*#scaledpi#-(#padding#/2)/2)),(((#heightE#/2+12)*#scaledpi#)-(1*#scaledpi#-(#padding#/2)/2)),(2*#scaledpi#) | Fill Color 250,160,14 | StrokeWidth 0
Hidden=[measurefunnythings]
DynamicVariables=1