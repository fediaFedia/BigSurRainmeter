[Rainmeter]
DragGroup=BigSur
Group=Widget | BigSur
Author=Xyrfo and fediaFedia
OnRefreshAction=[!SetTransparency "#opacity#"]
MouseActionCursor=0
MiddleMouseUpAction=!DeactivateConfig
Update=5000

Blur=#globalblurenable#
BlurRegion=2,(11-#Padding#)*#ScaleDpi#,(10-#Padding#)*#ScaleDpi#,(#height#+#Padding#+#Padding#)*#ScaleDpi#,(#height#+#Padding#+#Padding#)*#ScaleDpi#,(#radius#*#ScaleDpi#)

RightMouseUpAction=[!SkinCustomMenu]
ContextTitle=#Settings#
ContextAction=["#@#Config.exe" #Type# "#CURRENTCONFIG#" "#CURRENTFILE#" "#SETTINGSPATH#" "#SKINSPATH#" "#PROGRAMPATH#" "#scaledpi#"]

ContextTitle2=#Alternative#
ContextAction2=[!ActivateConfig "#CURRENTCONFIG#"]
ContextTitle3=#Close#
ContextAction3=[!DeactivateConfig]
ContextTitle4=----
ContextAction4=[]
ContextTitle5=#AddItems#
ContextAction5=[!ActivateConfig "BigSur\Gallery" "Gallery.ini"]
ContextTitle6=----
ContextAction6=[]
ContextTitle7=#MoreActions#
ContextAction7=[!SkinMenu]

[Metadata]
Version=1.5.0
Information=BigSur 27 for Rainmeter
License=Creative Commons Attribution-Noncommercial-Share Alike 3.0 License

 
 [Variables] 
Type=Mini
@include=#@#Global.inc
@include1=#@#Languages\#MainLanguage#.inc
@include2=#@#\Structure\#Type#\Type.inc
@include3=#currentpath#\UserVariables.inc
Name=#ItemName#







[MeasureFreeDiskSpace]
Measure=FreeDiskSpace
Drive=#Disk#:
Substitute=" ":""


[PowerE]
Meter=ROUNDLINE
MeasureName=
MeterStyle=Full
LineWidtH=1
StartAngle=6.40
RotationAngle=6.2831853
LineLengtH=(#Height#/6)*#scaledpi#
LineStart=(#Height#/6-10)*#scaledpi#
DynamicVariables=1
LineColor=#textcolor2#,30
Solid=1
AntiAlias=1


[Power]
Meter=ROUNDLINE
MeasureName=MeasureFreeDiskSpace
MeterStyle=Full
LineWidtH=1
StartAngle=6.40
RotationAngle=6.2831853
LineLengtH=(#Height#/6)*#scaledpi#
LineStart=(#Height#/6-10)*#scaledpi#
DynamicVariables=1
LineColor=#textcolor2#,100
Solid=1
AntiAlias=1



[Name]
Meter=String
MeasureName=MeasureFreeDiskSpace
Text=%1B
MeterStyle=Style
x=(46)*#scaledpi#
y=(38)*#scaledpi#
StringAlign=CENTER
StringStyle=Normal
FontColor=#textcolor2#,#textopacity#
FontFace=#ThemeFont#
InlineSetting=#InlineShadow#
FontSize=(10*#scaledpi#)
AntiAlias=1
NumOfDecimals=1
AutoScale=1
MouseActionCursor=1
LeftMouseUpAction=!execute ["#disk#:\"]
ToolTipText=Open #disk#:\