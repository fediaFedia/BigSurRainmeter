[Rainmeter]
DragGroup=BigSur
Group=Widget | BigSur
Author=Xyrfo and fediaFedia
OnRefreshAction=[!SetTransparency "#opacity#"]
MouseActionCursor=0
MiddleMouseUpAction=!DeactivateConfig
Update=2000

MouseOverAction=[!ShowMeter Play][!ShowMeter Next][!Redraw]
MouseLeaveAction=[!HideMeter Play][!HideMeter Next][!Redraw]
Blur=#globalblurenable#
BlurRegion=2,(11-#Padding#)*#ScaleDpi#,(10-#Padding#)*#ScaleDpi#,(#height#+#Padding#+#Padding#)*#ScaleDpi#,(#height#+#Padding#+#Padding#)*#ScaleDpi#,(#radius#*#ScaleDpi#)

RightMouseUpAction=[!SkinCustomMenu]
ContextTitle=#Settings#
ContextAction=["#@#Config.exe" #Type# "#CURRENTCONFIG#" "#CURRENTFILE#" "#SETTINGSPATH#" "#SKINSPATH#" "#PROGRAMPATH#" "#scaledpi#"]



ContextTitle2=Spotify
ContextAction2=[!ActivateConfig "BigSur\Widgets\Regular\Spotify" "Item.ini"][!DeactivateConfig]
ContextTitle3=#Alternative#
ContextAction3=[!ActivateConfig "#CURRENTCONFIG#"]
ContextTitle4=#Close#
ContextAction4=[!DeactivateConfig]
ContextTitle5=----
ContextAction5=[]
ContextTitle6=#AddItems#
ContextAction6=[!ActivateConfig "BigSur\Gallery" "Gallery.ini"]
ContextTitle7=----
ContextAction7=[]
ContextTitle8=#MoreActions#
ContextAction8=[!SkinMenu]

[Metadata]
Version=1.5.0
Information=BigSur 27 for Rainmeter
License=Creative Commons Attribution-Noncommercial-Share Alike 3.0 License

 


 [Variables] 
Type=Mini
@include=#@#Global.inc
@include1=#@#Languages\#MainLanguage#.inc
@include2=#@#\Structure\#Type#\Type.inc
@include3=UserVariables.inc
Name=#Player#
Height=160
CurrentSong=Havana

CurrentArtist=Legacy





[mPlayer]
Measure=Plugin
Plugin=NowPlaying.dll
PlayerName=#Player#
PlayerType=TITLE
PlayerPatH=
DisableLeadingZero=0
Substitute="":"-"
; Return value is 1 on error
IfEqualValue=1
IfEqualAction=[!ShowMeter ErrorMessage][!Redraw]



[mStateButtan]
Measure=Plugin
Plugin=NowPlaying.dll
PlayerName=[mPlayer]
PlayerType=STATE
Substitute="0":"Play.png","1":"Pause.png","2":"Play.png"

[mArtist]
Measure=Plugin
Plugin=NowPlaying.dll
PlayerName=[mPlayer]
PlayerType=ARTIST
Substitute="":"-"

[mAlbum]
Measure=Plugin
Plugin=NowPlaying.dll
PlayerName=[mPlayer]
PlayerType=ALBUM
Substitute="":"-"

[mCover]
Measure=Plugin
Plugin=NowPlaying.dll
PlayerName=[mPlayer]
PlayerType=COVER
Substitute="":"#@#Graphics\Music\Default.png"






[Style]
StringAlign=CENTER
StringStyle=Normal
FontColor=255,255,255
FontFace=#ThemeFont#
AntiAlias=1



[Buttons]
W=((#Height#/6))*#scaledpi#
H=((#Height#/6))*#scaledpi#
ImageTint=#textcolor2#,#paneltitleopacity#
MouseActionCursor=1

[MeterAlbumd]
Meter=Image
MeasureName=mCover
MeasureName2=mPlayer
MeasureName3=mArtist
MeasureName4=mAlbum
MeterStyle=Full

ImageName="%1"
DynamicVariables=1
Container=MeterContainer
ImageTint=#IconTintSpecial#
Greyscale=#IconGreyscale#
ToolTipText=%3#CRLF#%4
ToolTipTitle=%2


[MeterContainer]
Meter=Shape
Shape=Rectangle (11-#Padding#)*#ScaleDpi#,(1+(11-#Padding#))*#ScaleDpi#,(69+#Padding#+#Padding#)*#ScaleDpi#,(69+#Padding#+#Padding#)*#ScaleDpi#,(#radius#*#ScaleDpi#) | Fill Color 255,47,47,255 | StrokeWidth 0
X=0
Y=0






[Play]
Meter=Image
ImageName=#@#Graphics\Music\[mStateButtan]
DynamicVariables=1
x=(5)*#scaledpi#
Y=(30)*#scaledpi#
w=(40)*#scaledpi#
h=(40)*#scaledpi#
imagetint=#redcolor#
LeftMouseUpAction=[!CommandMeasure mPlayer PlayPause][!Update]

MeterStyle=Buttons
Hidden=1



[Next]
Meter=Image
ImageName=#@#Graphics\Music\Next.png
X=R
imagetint=#redcolor#
Y=(30)*#scaledpi#

LeftMouseUpAction=!CommandMeasure mPlayer Next
MeterStyle=ButtonsE
Hidden=1
mouseactioncursor=1
w=(40)*#scaledpi#
h=(40)*#scaledpi#


[Text]
Meter=String
Text=#ShowPlayerName#
