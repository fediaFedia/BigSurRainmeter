[Rainmeter]
DragGroup=BigSur
Group=Widget | BigSur
Author=Xyrfo and fediaFedia
OnRefreshAction=[!SetTransparency "#opacity#"]
MouseActionCursor=0
MiddleMouseUpAction=!DeactivateConfig
Update=#ShowSeconds#000

Blur=#globalblurenable#
BlurRegion=2,(11-#Padding#)*#ScaleDpi#,(10-#Padding#)*#ScaleDpi#,(#height#*2+20+#Padding#+#Padding#)*#ScaleDpi#,(#height#+#Padding#+#Padding#)*#ScaleDpi#,(#radius#*#ScaleDpi#)

RightMouseUpAction=[!SkinCustomMenu]
ContextTitle=#Settings#
ContextAction=["#@#Config.exe" #Type# "#CURRENTCONFIG#" "#CURRENTFILE#" "#SETTINGSPATH#" "#SKINSPATH#" "#PROGRAMPATH#" "#scaledpi#"]

ContextTitle2=#EditSmartStack#
ContextAction2=[!ActivateConfig "#CURRENTCONFIG#" "Item.ini"]
ContextTitle3=#Close#
ContextAction3=[!DeactivateConfig]
ContextTitle4=----
ContextAction4=[]
ContextTitle5=#AddItems#
ContextAction5=[!ActivateConfig "BigSur\Gallery" "Gallery.ini"]
ContextTitle6=----
ContextAction6=[]
ContextTitle7=#MoreActions#
ContextAction7=[!SkinMenu]
MouseOverAction=[!ShowMeter e][!ShowMeter hint][!Update]
MouseLeaveAction=[!HideMeter e][!HideMeter hint][!Update]

[Metadata]
Version=1.5.0
Information=BigSur 26 for Rainmeter
License=Creative Commons Attribution-Noncommercial-Share Alike 3.0 License

 
 [Variables] 
Type=Double
@include=#@#Global.inc
@include1=#@#Languages\#MainLanguage#.inc
@include2=#@#\Structure\#Type#\Type.inc
@include3=..\WorldClock\UserVariables.inc
@include4=UserVariables.inc
Name=#ClockName#
NightEnds=6
NightStarts=22
Height=160
HideHint=0


[MeasureNight1]
Measure=Time
Format=%H
TimeZone=#CityZone1#
IfCondition=((MeasureNight1 >= #NightEnds#) && (MeasureNight1 < #NightStarts#))
IfFalseAction=[!SetOption d1 imagetint 255,255,255][!SetOption c1 ImageName #@#Graphics\Clock\clockW#clockstyle#1.png][!SetOption e1 fontcolor 255,255,255][!SetOption i1 fontcolor 255,255,255][!SetOption Minutes ImageTint 255,255,255][!SetOption Hours ImageTint 255,255,255][!Update]
IfTrueAction=[!SetOption d1 imagetint 0,0,0][!SetOption c1 ImageName #@#Graphics\Clock\clockW#clockstyle#0.png][!SetOption e1 fontcolor 0,0,0][!SetOption i1 fontcolor 0,0,0][!SetOption Minutes ImageTint 0,0,0][!SetOption Hours ImageTint 0,0,0][!Update]
DynamicVariables=1
UpdateDivider=30
Disabled=#EnableNight#

[MeasureNight2]
Measure=Time
Format=%H
TimeZone=#CityZone2#
IfCondition=((MeasureNight2 >= #NightEnds#) && (MeasureNight2 < #NightStarts#))
IfFalseAction=[!SetOption d2 imagetint 255,255,255][!SetOption c2 ImageName #@#Graphics\Clock\clockW#clockstyle#1.png][!SetOption e2 fontcolor 255,255,255][!SetOption i2 fontcolor 255,255,255][!SetOption Minutes2 ImageTint 255,255,255][!SetOption Hours2 ImageTint 255,255,255][!Update]
IfTrueAction=[!SetOption d2 imagetint 0,0,0][!SetOption c2 ImageName #@#Graphics\Clock\clockW#clockstyle#0.png][!SetOption e2 fontcolor 0,0,0][!SetOption i2 fontcolor 0,0,0][!SetOption Minutes2 ImageTint 0,0,0][!SetOption Hours2 ImageTint 0,0,0][!Update]
DynamicVariables=1
UpdateDivider=30
Disabled=#EnableNight#

[MeasureNight3]
Measure=Time
Format=%H
TimeZone=#CityZone3#
IfCondition=((MeasureNight3 >= #NightEnds#) && (MeasureNight3 < #NightStarts#))
IfFalseAction=[!SetOption d3 imagetint 255,255,255][!SetOption c3 ImageName #@#Graphics\Clock\clockW#clockstyle#1.png][!SetOption e3 fontcolor 255,255,255][!SetOption i3 fontcolor 255,255,255][!SetOption Minutes3 ImageTint 255,255,255][!SetOption Hours3 ImageTint 255,255,255][!Update]
IfTrueAction=[!SetOption d3 imagetint 0,0,0][!SetOption c3 ImageName #@#Graphics\Clock\clockW#clockstyle#0.png][!SetOption e3 fontcolor 0,0,0][!SetOption i3 fontcolor 0,0,0][!SetOption Minutes3 ImageTint 0,0,0][!SetOption Hours3 ImageTint 0,0,0][!Update]
DynamicVariables=1
UpdateDivider=30
Disabled=#EnableNight#

[MeasureNight4]
Measure=Time
Format=%H
TimeZone=#CityZone4#
IfCondition=((MeasureNight4 >= #NightEnds#) && (MeasureNight4 < #NightStarts#))
IfFalseAction=[!SetOption d4 imagetint 255,255,255][!SetOption c4 ImageName #@#Graphics\Clock\clockW#clockstyle#1.png][!SetOption e4 fontcolor 255,255,255][!SetOption i4 fontcolor 255,255,255][!SetOption Minutes4 ImageTint 255,255,255][!SetOption Hours4 ImageTint 255,255,255][!Update]
IfTrueAction=[!SetOption d4 imagetint 0,0,0][!SetOption c4 ImageName #@#Graphics\Clock\clockW#clockstyle#0.png][!SetOption e4 fontcolor 0,0,0][!SetOption i4 fontcolor 0,0,0][!SetOption Minutes4 ImageTint 0,0,0][!SetOption Hours4 ImageTint 0,0,0][!Update]
DynamicVariables=1
UpdateDivider=30
