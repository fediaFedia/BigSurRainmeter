[Rainmeter]
DragGroup=BigSur
Group=Widget | BigSur
Author=Xyrfo and fediaFedia
OnRefreshAction=[!SetTransparency "#opacity#"]
MouseActionCursor=0
MiddleMouseUpAction=!DeactivateConfig
Update=60000

Blur=#globalblurenable#
BlurRegion=2,(11-#Padding#)*#ScaleDpi#,(10-#Padding#)*#ScaleDpi#,(#height#*2+20+#Padding#+#Padding#)*#ScaleDpi#,(#height#+#Padding#+#Padding#)*#ScaleDpi#,(#radius#*#ScaleDpi#)

RightMouseUpAction=[!SkinCustomMenu]
ContextTitle=#Settings#
ContextAction=["#@#Config.exe" #Type# "#CURRENTCONFIG#" "#CURRENTFILE#" "#SETTINGSPATH#" "#SKINSPATH#" "#PROGRAMPATH#" "#scaledpi#"]

ContextTitle2=#Alternative#
ContextAction2=[!ActivateConfig "#CURRENTCONFIG#"]
ContextTitle3=#Close#
ContextAction3=[!DeactivateConfig]
ContextTitle4=----
ContextAction4=[]
ContextTitle5=#AddItems#
ContextAction5=[!ActivateConfig "BigSur\Gallery" "Gallery.ini"]
ContextTitle6=----
ContextAction6=[]
ContextTitle7=#MoreActions#
ContextAction7=[!SkinMenu]

[Metadata]
Version=1.5.0
Information=BigSur 27 for Rainmeter
License=Creative Commons Attribution-Noncommercial-Share Alike 3.0 License

 
 [Variables] 


Type=Double
@include=#@#Global.inc
@include1=#@#Languages\#MainLanguage#.inc
@include2=#@#\Structure\#Type#\Type.inc
@include3=UserVariables.inc
Name=#Photos#
Height=160


[img]
Meter=Image
ImageName=None.png
x=(150)*#scaledpi#
y=(50)*#scaledpi#
w=(60)*#scaledpi#
h=(60)*#scaledpi#
ImageTint=#Textcolor2#

[Non]
Meter=String
MeterStyle=Default
Text=#NoPictures#
stringalign=centercenter
x=(180)*#scaledpi#
y=(125)*#scaledpi#
w=(120)*#scaledpi#
h=(120)*#scaledpi#
ClipString=1
LeftMouseUpAction=["#@#Config.exe" #Type# "#CURRENTCONFIG#" "#CURRENTFILE#" "#SETTINGSPATH#" "#SKINSPATH#" "#PROGRAMPATH#" "#scaledpi#"]



[Random]
Measure=Plugin
Plugin=Plugins\QuotePlugin.dll
PathName="#PicturesFolder#"
Subfolders=#subfolders#
FileFilter=*.jpg;*.gif;*.png;*.jpeg;*.bmp

[Image]
MeasureName=Random
Meter=Image
MeterStyle=Full
FileFilter=*.jpg;*.gif;*.png;*.jpeg;*.bmp
PreserveAspectRatio=#KeepAspectRatio#
LeftMouseUpAction=["[Random]"]
Container=MeterContainer
DynamicVariables=1
ImageTint=#ColorizeColor#
Greyscale=#Colorize#

[ResetColorize]
Measure=Calc
Formula=#Colorize#
IfCondition=ResetColorize < 1
IfTrueAction=[!WriteKeyValue Variables ColorizeColor "" "UserVariables.inc"][!SetOption Image ImageTint ""][!Update]


[MeterContainer]
Meter=Shape
Shape=Rectangle (11-#Padding#)*#ScaleDpi#,(11-#Padding#)*#ScaleDpi#,(172*2+#Padding#+#Padding#)*#ScaleDpi#,(#height#+#Padding#+#Padding#)*#ScaleDpi#,(#radius#)*#ScaleDpi#,(#radius#*#scaledpi#) | Fill Color 255,47,47,255 | StrokeWidth 0
X=0
Y=0


[FolderName]
Measure=String
String=[Random]
RegExpSubstitute=1
;Substitute="^.*[\/\\]":""
DynamicVariables=1
Substitute="[\\\/][^\\\/]+$":"", "^.*[\\\/]":""


[FileName]
Measure=String
String=[Random]
RegExpSubstitute=1
;Substitute="^.*[\/\\]":""
Substitute="^.*[\/\\]":"", "\.[^.]*$":""
DynamicVariables=1


[Text]
Meter=String
Text=#Show Filename#
DynamicVariables=1
LeftMouseUpAction=["#PicturesFolder#"]
ToolTipTitle=#Show Filename#
ToolTipText=Open folder
MouseActionCursor=1
solidcolor=0,0,0,1
ClipString=1