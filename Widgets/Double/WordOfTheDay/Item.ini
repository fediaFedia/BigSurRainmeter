[Rainmeter]
DragGroup=BigSur
Group=Widget | BigSur
Author=Xyrfo and fediaFedia
OnRefreshAction=[!SetTransparency "#opacity#"]
MouseActionCursor=0
MiddleMouseUpAction=!DeactivateConfig
Update=8640000

Blur=#globalblurenable#
BlurRegion=2,(11-#Padding#)*#ScaleDpi#,(10-#Padding#)*#ScaleDpi#,(#height#*2+20+#Padding#+#Padding#)*#ScaleDpi#,(#height#+#Padding#+#Padding#)*#ScaleDpi#,(#radius#*#ScaleDpi#)

RightMouseUpAction=[!SkinCustomMenu]
ContextTitle=#Settings#
ContextAction=["#@#Config.exe" #Type# "#CURRENTCONFIG#" "#CURRENTFILE#" "#SETTINGSPATH#" "#SKINSPATH#" "#PROGRAMPATH#" "#scaledpi#"]
ContextTitle2=#Close#
ContextAction2=[!DeactivateConfig]
ContextTitle3=----
ContextAction3=[]
ContextTitle4=#AddItems#
ContextAction4=[!ActivateConfig "BigSur\Gallery" "Gallery.ini"]
ContextTitle5=----
ContextAction5=[]
ContextTitle6=#MoreActions#
ContextAction6=[!SkinMenu]

[Metadata]
Version=1.5.0
Information=BigSur 27 for Rainmeter
License=Creative Commons Attribution-Noncommercial-Share Alike 3.0 License

 
 [Variables] 
Type=Double
@include=#@#Global.inc
@include1=#@#Languages\#MainLanguage#.inc
@include2=#@#\Structure\#Type#\Type.inc
@include3=UserVariables.inc
Name=Word of the Day





[Feed]
Measure=Plugin
Plugin=Plugins\WebParser.dll
Url="https://www.merriam-webster.com/wotd/feed/rss2"
RegExp="(?siU)Merriam-Webster's Word of the Day for [^<]+? is:\s*([a-zA-Z-]+)\s*\\([^\\]+)\\\s*(\w+)\s+([^/]*?)\s*//"

UpdateRate=3600
StringIndex=1
Substitute=#SubstituteFeed#
FinishAction=!Update "#CURRENTCONFIG#"


[MeasureItem1]
Measure=Plugin
Plugin=Plugins\WebParser.dll
Url=[Feed]
StringIndex=1
Substitute=#SubstituteFeed#

[MeasureItem2]
Measure=Plugin
Plugin=Plugins\WebParser.dll
Url=[Feed]
StringIndex=2
Substitute='"':""

[MeasureItem3]
Measure=Plugin
Plugin=Plugins\WebParser.dll
Url=[Feed]
StringIndex=3
Substitute='"':""

[MeasureItem4]
Measure=Plugin
Plugin=Plugins\WebParser.dll
Url=[Feed]
StringIndex=4
Substitute='"':""

[me]
meter=Image
imagename=souse.jpg
meterstyle=Full

[Date]
Measure=Time
Format=%b %d


[T]
Meter=String
x=(22)*#scaledpi#
y=(21)*#scaledpi#
StringAlign=left
FontColor=#textcolor2#,100
FontFace=#ThemeFont#
AntiAlias=1
w=#Height#
ClipString=1
h=#Height#
InlineSetting=#InlineShadow#
FontSize=(9)*#scaledpi#
Text=WORD OF THE DAY
FontWeight=700


[Word]
Meter=String
x=r

y=(21)*#scaledpi#r
StringAlign=left
FontColor=#textcolor2#,255
FontFace=Times New Roman
AntiAlias=1
w=(#Height#*1.5)
ClipString=1
h=#Height#
InlineSetting=#InlineShadow#
FontSize=(16)*#scaledpi#
MeasureName=MeasureItem1
FontWeight=700
LeftMouseUpAction=!execute ["https://www.merriam-webster.com/word-of-the-day"]
MouseActionCursor=1

[Adj]
Meter=String
MeasureName=MeasureItem2
MeasureName2=MeasureItem3
Text=%1, %2
x=r
y=(32)*#scaledpi#r
StringAlign=left
FontColor=#textcolor2#,100
FontFace=Times New Roman
AntiAlias=1
w=#Height#
ClipString=1
h=#Height#
InlineSetting=#InlineShadow#
FontSize=(10)*#scaledpi#
StringStyle=Italic


[Def]
Meter=String
MeasureName=MeasureItem4
x=r
y=(22)*#scaledpi#r
StringAlign=left
FontColor=#textcolor2#,220
FontFace=Times New Roman
AntiAlias=1
w=(#Height#*2)*#scaledpi#
ClipString=1
h=(#Height#*0.4)
InlineSetting=#InlineShadow#
FontSize=(11)*#scaledpi#
LeftMouseUpAction=!execute ["https://www.merriam-webster.com/word-of-the-day"]
MouseActionCursor=1
ToolTipText=%1

[T1]
Meter=String
x=(338)*#scaledpi#
y=(21)*#scaledpi#
StringAlign=right
FontColor=#textcolor2#,100
FontFace=#ThemeFont#
AntiAlias=1
w=#Height#
ClipString=1
h=#Height#
InlineSetting=#InlineShadow#
FontSize=(9)*#scaledpi#
MeasureName=Date
StringCase=Upper
FontWeight=700










